/* =====================================================================
   THEME TOKENS — edit these to restyle the whole app.
   Dark is the default; light overrides follow.
   ===================================================================== */
:root{
  --font:"Source Sans 3","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* surfaces (warm forest charcoal) */
  --bg:#11140f;--glow:#1d2717;--panel:#191d16;--panel2:#21261d;--panel3:#2a3025;
  --line:#2e3428;--line-strong:#454d3c;
  --text:#ebe9de;--muted:#a09f8f;--faint:#717464;
  /* brand: moss / forest */
  --accent:#8db56b;--accent-strong:#a8cf85;--accent-soft:rgba(141,181,107,.14);--accent-ink:#11170c;--brand-deep:#2f4a25;
  /* result states */
  --pass:#58bb8c;--partial:#e2ad4c;--fail:#e46f61;--blocked:#8195aa;--skipped:#8e8b7e;--retest:#ab92e2;--untested:#2b3126;
  --feat:var(--accent);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 20px rgba(0,0,0,.22);
  --shadow-hover:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px rgba(0,0,0,.34);
  --r:14px;--r-sm:9px;
  --card-pad:16px;--test-pad:14px;--note-h:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f1e8;--glow:#e6ecd9;--panel:#fbfaf4;--panel2:#efede3;--panel3:#e5e2d5;
  --line:#ddd9ca;--line-strong:#c3bfad;
  --text:#1f2419;--muted:#666a5a;--faint:#8d8f80;
  --accent:#4d7a37;--accent-strong:#3d652b;--accent-soft:rgba(77,122,55,.11);--accent-ink:#ffffff;--brand-deep:#2f4a25;
  --pass:#2e8f62;--partial:#b7801b;--fail:#c2493d;--blocked:#5a6d83;--skipped:#8a877a;--retest:#7a5cc0;--untested:#e2dfd2;
  --shadow:0 1px 2px rgba(40,45,30,.06),0 4px 14px rgba(40,45,30,.05);
  --shadow-hover:0 2px 4px rgba(40,45,30,.07),0 12px 28px rgba(40,45,30,.10);
  color-scheme:light;
}
body.compact{--card-pad:12px;--test-pad:10px;--note-h:38px}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{background:var(--bg);scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 520px at 8% -8%,var(--glow) 0%,transparent 62%) no-repeat,var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);cursor:pointer;text-decoration:none}a:hover{color:var(--accent-strong)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s,transform .08s,color .15s}
button:hover{border-color:var(--line-strong);background:var(--panel3)}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}button.ghost:hover{color:var(--text);background:var(--panel2)}
button.danger:hover{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 50%,transparent)}
button.icon{padding:6px}
select,input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;transition:border-color .15s,box-shadow .15s}
select:hover,input[type=text]:hover,textarea:hover{border-color:var(--line-strong)}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;min-height:var(--note-h)}
input[type=text]{min-width:0}
code{font:12px/1.4 var(--mono);background:var(--panel3);padding:2px 7px;border-radius:6px;color:var(--text)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:10px 22px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand svg,.brand .logo-img{width:30px;height:30px;flex:none;object-fit:contain}
.logo-img{display:block}
.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.top nav a{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--r-sm);color:var(--muted);transition:background .15s,color .15s}
.top nav a:hover{color:var(--text);background:var(--panel2)}
.top nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
.top .right{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center}
main{overflow-anchor:none;max-width:1180px;margin:0 auto;padding:26px 16px 90px}
.banner{max-width:1180px;margin:12px auto 0;padding:10px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--partial) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--partial) 40%,var(--line));display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:26px;margin:4px 0;letter-spacing:-.02em;line-height:1.2}h2{font-size:17px;margin:0;letter-spacing:-.01em}h3{font-size:16px;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:12.5px}
.sec{margin-bottom:38px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-head h2{display:flex;align-items:center;gap:8px}
.sec-head h2 .ic{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}

/* ---------- project cards ---------- */
.card{--pc:var(--accent);position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad) calc(var(--card-pad) + 2px);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--line-strong)}
.card.has-color::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--pc)}
.card.has-color{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 7%,var(--panel)) 0%,var(--panel) 45%)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card p{margin:0}
.card-rings{display:flex;gap:18px;align-items:center;padding:4px 0}
.ring-item{display:flex;gap:10px;align-items:center;min-width:0}
.ring-item .lab{display:flex;flex-direction:column;line-height:1.25;font-size:12.5px;color:var(--muted);min-width:0}
.ring-item .lab b{color:var(--text);font-size:14px}
.ring{--v:0;--c:var(--accent);--sz:54px;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--untested) 0);display:grid;place-items:center;position:relative}
.ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.card.has-color .ring::before{background:color-mix(in srgb,var(--pc) 4%,var(--panel))}
.ring span{position:relative;font-weight:700;font-size:12.5px}
.ring.big{--sz:72px}.ring.big::before{inset:8px}.ring.big span{font-size:15px}
.metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.metric b{color:var(--text);font-weight:600}
.bar{height:8px;border-radius:6px;background:var(--untested);overflow:hidden;display:flex}
.bar.big{height:12px}
.seg{display:block;height:100%;transition:width .4s ease}
.s-pass{background:var(--pass)}.s-partial{background:var(--partial)}.s-fail{background:var(--fail)}.s-blocked{background:var(--blocked)}.s-skipped{background:var(--skipped)}.s-retest{background:var(--retest)}.s-feat{background:var(--pc,var(--feat))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.chip .ic{width:12px;height:12px}
.st-Active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-strong)}
.st-Idea{background:color-mix(in srgb,var(--retest) 18%,transparent);color:var(--retest)}
.st-Paused{background:color-mix(in srgb,var(--partial) 18%,transparent);color:var(--partial)}
.st-Maintenance{background:color-mix(in srgb,var(--blocked) 22%,transparent);color:var(--blocked)}
.st-Completed{background:color-mix(in srgb,var(--pass) 18%,transparent);color:var(--pass)}
.st-Archived{background:var(--panel3);color:var(--faint)}
.c-pass{color:var(--pass)}.c-fail{color:var(--fail)}.c-partial{color:var(--partial)}.c-retest,.c-stale{color:var(--retest)}.c-blocked{color:var(--blocked)}.c-skipped{color:var(--skipped)}
.pills{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pills span{display:inline-flex;align-items:center;gap:5px}
.pills .ic{width:13px;height:13px}

/* ---------- project page ---------- */
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.ph h1{display:flex;align-items:center;gap:12px}
.ph .swatch{width:14px;height:14px;border-radius:5px;background:var(--pc,var(--accent));box-shadow:0 0 0 4px color-mix(in srgb,var(--pc,var(--accent)) 22%,transparent)}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px}
.tabs a.tab-right{margin-left:auto}.tabs a.tab-ico{padding-left:12px;padding-right:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs a{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--text);border-color:var(--pc,var(--accent))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.kpi .txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);font-size:13.5px}
tr:last-child td{border-bottom:0}
th{color:var(--faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover{background:var(--panel2)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:57px;z-index:3;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.toolbar .spacer{flex:1}
.seg-btns{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel2)}
.seg-btns button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg-btns button.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.area-h{margin:22px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.batch-h{margin:24px 0 6px;font-size:17px;display:flex;align-items:baseline;gap:10px}
.batch-notes{font-size:13px;padding:8px 12px;border-radius:var(--r-sm);background:var(--panel2);border-left:3px solid var(--line-strong);margin:6px 0}

/* ---------- test cards ---------- */
.test{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--untested);border-radius:var(--r);padding:var(--test-pad) calc(var(--test-pad) + 2px);margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .2s}
.test.st-pass{border-left-color:var(--pass)}.test.st-partial{border-left-color:var(--partial)}.test.st-fail{border-left-color:var(--fail)}.test.st-blocked{border-left-color:var(--blocked)}.test.st-skipped{border-left-color:var(--skipped)}.test.st-retest,.test.st-stale{border-left-color:var(--retest)}
.t-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t-head b{font-size:15px}
.t-body{margin:6px 0 8px;font-size:14px}
.t-body p{margin:3px 0}
.t-body ol{margin:3px 0 3px 20px;padding:0}
.lbl{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-right:7px}
.t-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sbtn{font-size:13px;padding:5px 10px}
.sbtn .ic{width:14px;height:14px}
.sbtn.k-pass:hover{color:var(--pass)}.sbtn.k-partial:hover{color:var(--partial)}.sbtn.k-fail:hover{color:var(--fail)}.sbtn.k-blocked:hover{color:var(--blocked)}.sbtn.k-retest:hover{color:var(--retest)}
.sbtn.on,.sbtn.on:hover{color:#fff;font-weight:600}
.sbtn.on.k-pass{background:var(--pass);border-color:var(--pass)}
.sbtn.on.k-partial{background:var(--partial);border-color:var(--partial)}
.sbtn.on.k-fail{background:var(--fail);border-color:var(--fail)}
.sbtn.on.k-blocked{background:var(--blocked);border-color:var(--blocked)}
.sbtn.on.k-skipped{background:var(--skipped);border-color:var(--skipped)}
.sbtn.on.k-retest{background:var(--retest);border-color:var(--retest)}
.note-info{font-size:12.5px;padding:7px 11px;border-radius:var(--r-sm);background:var(--panel2);margin:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.atts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px}
.att{position:relative}
.att img{height:64px;width:auto;max-width:140px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--panel2);transition:transform .15s}
.att img:hover{transform:scale(1.04)}
.att button{position:absolute;top:-7px;right:-7px;padding:1px;border-radius:10px}
.att button .ic{width:12px;height:12px}
.filebtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:4px 10px;cursor:pointer;transition:color .15s,border-color .15s}
.filebtn:hover{color:var(--accent);border-color:var(--accent)}
.filebtn input{display:none}
body.compact .t-body{font-size:13px;margin:4px 0 6px}
body.compact .t-body ol{display:flex;flex-wrap:wrap;gap:2px 18px;margin-left:16px}
body.compact .test{margin-bottom:7px}
body.compact textarea[data-in="notes"]{height:var(--note-h)}
body.compact .sbtn{padding:3px 8px;font-size:12px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r);background:color-mix(in srgb,var(--panel) 50%,transparent)}

/* ---------- features editor ---------- */
.area{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.area-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.area-head input{font-weight:700;font-size:16px;flex:1;background:transparent;border-color:transparent}
.area-head input:hover{border-color:var(--line)}
.area-head .bar{width:150px}
.feat{border-top:1px solid var(--line);padding:8px 0}
.feat-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feat-row input{flex:1;min-width:160px}
.pct{font-size:12.5px;font-weight:700;width:42px;text-align:right}
.feat-body{padding:8px 0 4px 38px;display:flex;flex-direction:column;gap:6px}
.part{display:flex;gap:6px;align-items:center}.part input{flex:1}
.form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta-grid{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:14px}
.meta-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.color-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;font-size:13px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--panel3);border:1px solid var(--line-strong);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(14px);background:var(--accent-ink)}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--text)}
input[type=color]{width:34px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer}
.welcome{max-width:660px;margin:50px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.welcome .logo-big svg,.welcome .logo-big .logo-img{width:72px;height:72px;object-fit:contain}
.welcome ol{padding-left:20px}
.welcome li{margin-bottom:6px}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
main.enter .card,main.enter .kpi,main.enter .panel,main.enter .area,main.enter .test{animation:rise .35s ease both}
main.enter .grid>*:nth-child(2){animation-delay:.04s}main.enter .grid>*:nth-child(3){animation-delay:.08s}main.enter .grid>*:nth-child(4){animation-delay:.12s}main.enter .grid>*:nth-child(n+5){animation-delay:.16s}
main.enter .bar{transform-origin:left;animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);background:var(--panel);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0);animation:toastGlow 1.6s ease-out}
#toast.clickable{pointer-events:auto;cursor:pointer}
#toast.clickable:hover{background:var(--panel2);border-color:var(--accent)}
#toast.big{font-size:14.5px;padding:13px 20px;font-weight:600}
#toast .toast-go{color:var(--accent-strong);margin-left:8px;white-space:nowrap}
@keyframes toastGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent),0 10px 30px rgba(0,0,0,.35)}35%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent),0 0 28px 4px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent,0 10px 30px rgba(0,0,0,.35)}}
#saving{font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.top nav{flex-wrap:nowrap}.top nav a{padding:6px 8px}.sec-head{flex-wrap:wrap}.card-rings{gap:12px}.ring{--sz:48px}.meta-grid{grid-template-columns:1fr}.top{gap:10px;padding:8px 12px}.brand span{display:none}.top .right .ws,.top .right [data-act="choose-ws"]{display:none}.feat-body{padding-left:0}.area-head .bar{width:70px}h1{font-size:22px}}

/* =====================================================================
   SWAPPABLE LOOKS (Settings). "Calm workshop" = the :root tokens above.
   ===================================================================== */
:root{--font-head:var(--font)}
/* Game-dev HQ: deep slate + ember */
:root[data-palette="hq"]{--bg:#0f1115;--glow:#2a1a12;--panel:#171a20;--panel2:#1f232b;--panel3:#282d37;--line:#2b3039;--line-strong:#3f4552;--text:#ecebe6;--muted:#9da3ae;--faint:#6c727e;--accent:#e08a4f;--accent-strong:#f0a26c;--accent-soft:rgba(224,138,79,.15);--accent-ink:#1a0f08;--brand-deep:#4a2a17;--untested:#262a33}
:root[data-palette="hq"][data-theme="light"]{--bg:#f5f3f0;--glow:#f6e2d2;--panel:#ffffff;--panel2:#f0ede8;--panel3:#e6e2db;--line:#ddd8cf;--line-strong:#c5bfb4;--text:#1d1f24;--muted:#636873;--faint:#8d919a;--accent:#b8622a;--accent-strong:#9a4f1f;--accent-soft:rgba(184,98,42,.11);--accent-ink:#fff;--untested:#e6e2db}
/* Crisp pro: cool neutrals + indigo */
:root[data-palette="pro"]{--bg:#0b0d10;--glow:#151a24;--panel:#12151a;--panel2:#191d24;--panel3:#222731;--line:#232831;--line-strong:#353c48;--text:#e6e8ec;--muted:#8f96a3;--faint:#636a76;--accent:#7c8cff;--accent-strong:#98a5ff;--accent-soft:rgba(124,140,255,.14);--accent-ink:#0b0d10;--brand-deep:#262d6b;--untested:#1f242c;--shadow:0 1px 0 rgba(255,255,255,.03) inset}

<header class="top"><a class="brand" data-act="nav" data-page="home" style="color:inherit"><img class="logo-img" alt="" src=""><span>Workbench</span></a><nav id="nav"></nav><div class="right" id="topright"></div></header>

<button id="toTop" class="to-top" data-act="to-top" title="Back to top" aria-label="Back to top"></button>
<script>
'use strict';
/* =====================================================================
   Workbench — single-file app (Chrome / Edge).
   Reads/writes <project>/proj_management/{TESTS,FEATURES,FEEDBACK}.md
   via the File System Access API. Folder handles remembered in IndexedDB.
   Open with ?demo for an in-memory demo.
   ===================================================================== */

const APP_VERSION='0.20.1';
const RUN_MODE=location.protocol==='file:'?'file':(matchMedia('(display-mode: standalone)').matches||navigator.standalone?'app':'web');
const STAGES=['Ideated','Designed','Testing','Iterating','Completed'];
const STAGE_PCT={Ideated:10,Designed:25,Testing:50,Iterating:75,Completed:100};
const STAGE_ALIAS={idea:'Ideated',ideation:'Ideated',ideate:'Ideated',design:'Designed',test:'Testing',iterate:'Iterating',iteration:'Iterating',complete:'Completed',done:'Completed'};
const STATUSES=['Idea','Active','Paused','Maintenance','Completed','Archived'];
const STATUS_ORDER={Active:0,Maintenance:1,Paused:2,Completed:3,Archived:4,Idea:5};
const STATES=[['pass','Pass'],['partial','Partial'],['fail','Fail'],['blocked','Blocked'],['skipped','Skipped'],['retest','Needs retest']];
const STATE_LABEL={untested:'Untested',pass:'PASS',partial:'PARTIAL',fail:'FAIL',blocked:'BLOCKED',skipped:'SKIPPED',retest:'NEEDS RETEST',stale:'NEEDS RETEST (test changed)'};
const SEVERITIES=['Critical','Major','Minor','Cosmetic'];
const ID_RE=/^([A-Z][A-Z0-9]*(?:[-_.][A-Z0-9]+)+)\s*(?:·|—|–|-|:|\|)\s*(.*)$/;

/* ---------------- agent notes placed at the top of each file ---------------- */
const TESTS_NOTE=`<!-- PROJ-MGMT:TESTS v1
NEVER REPLACE THIS FILE: read it and edit it in place. Keep every entry you aren't changing.
AGENT INSTRUCTIONS - You (the agent building this project) own this file. The human tests
using Workbench, which re-reads this file automatically whenever it changes.
Full spec: PROJ_MANAGEMENT_SPEC.md (Workbench folder).

ADDING A NEW BATCH (one per version/build you hand over for testing)
- Add "## Batch <version>" ABOVE older batches (newest first). Never delete old batches.
- Optional lines directly under it: "Date: YYYY-MM-DD", then free text (batch-wide setup/notes).
- Each test:
    ### <ID> · <Short title>
    Area: <area name from FEATURES.md>        (omit if the project has no areas)
    Feature: <feature ID from FEATURES.md>     (optional)
    Priority: must | should | could            (optional)
    Setup: <preconditions>                     (optional)
    Steps:
    1. <step>
    2. <step>
    Expected: <what should happen>
    Change: <commit / change this covers>      (optional)
    Retests: <ID>, <ID>                        (when this verifies a fix for a failed test)
  Any other line under a test is shown as its description.
- IDs: PREFIX-NNN in capitals (e.g. VGT-014). Unique across this whole file, never reused,
  never renumbered. Results are keyed by ID.
- Editing the title/setup/steps/expected of a test that already has a result flags it
  "needs retest". To verify a FIX, add a NEW test with "Retests: <old ID>" instead.
- Results and feedback are in FEEDBACK.md (read it, never edit it).
-->`;
const FEATURES_NOTE=`<!-- PROJ-MGMT:FEATURES v1
NEVER REPLACE THIS FILE: read it and edit it in place. Keep every entry you aren't changing.
AGENT INSTRUCTIONS - Shared file: you AND the human (through Workbench) edit it.
The tool re-writes it in the canonical layout below, so keep to that layout.
- Header lines: "Project: <name>", "Status: Idea|Active|Paused|Maintenance|Completed|Archived"
  (the human owns Status), "Summary: <one line>", optional "Color: #RRGGBB" (human's choice).
- "## <Area name>" = an area/subsection. Features above the first "##" apply to the whole
  project (use only that if the project has no areas).
- "### <ID> · <Title> [Stage]" = one feature. ID like F-AREA-01, unique, never reused.
  Stages: Ideated 10% | Designed 25% | Testing 50% | Iterating 75% | Completed 100%.
- Lines under a feature = its description. "Source: user" = requested by the human; treat
  these as requests to design/plan, and move them forward as you work.
- Multi-part feature: "- [Stage] part description" lines. When parts exist, the feature's
  completeness is the average of its parts and the feature's own [Stage] is ignored.
- Advance stages as work progresses (Designed when specced, Testing when a test batch
  covers it, Iterating while fixing feedback). The human normally sets Completed.
- Link tests to features with "Feature: <ID>" in TESTS.md.
-->`;
const LOGO_URI=document.querySelector('link[rel=icon]').href;const LOGO_SVG=`<img class="logo-img" alt="Workbench" src="${LOGO_URI}">`;document.querySelectorAll('.brand .logo-img').forEach(x=>x.src=LOGO_URI);
const DECISIONS_NOTE=`<!-- PROJ-MGMT:DECISIONS v1

async function addFromHandle(hd,opt={}){
  const d=await isDupe(hd);if(d)return {p:d,dupe:true};
  const existed=hd.name==='proj_management'||await hd.getDirectoryHandle('proj_management').then(()=>true,()=>false);
  const r={id:rid(),handle:hd};S.records.push(r);await saveRecords();const p=mkProject(r.id,'folder',hd);S.projects.push(p);await loadProject(p);
  if(opt.path&&!projPath(p)){S.paths[p.id]=rootPath(opt.path);lsSet('wb-paths',S.paths)}

let autoRestoring=false;
async function autoRestoreProjects(){ // projects whose path is inside the workspace can be re-added without a picker
  if(autoRestoring||!S.ws||!S.paths.__ws)return;autoRestoring=true;let n=0;
  try{const ws=rootPath(S.paths.__ws).toLowerCase(),left=[];
    for(const x of pendingProjects()){
      const pp=(x.path||'').toLowerCase();
      if(!pp.startsWith(ws+'\\')){left.push(x);continue}
      const parts=x.path.slice(ws.length+1).split(/[\\/]+/).filter(Boolean);let hd=S.ws;
      try{for(const seg of parts)hd=await hd.getDirectoryHandle(seg);
        const pm=await hd.getDirectoryHandle('proj_management').catch(()=>null);if(!pm)throw new Error('no proj_management');
        const r=await addFromHandle(hd,{path:x.path,quiet:true});if(r.p.loaded)n++;else left.push(x)}
      catch{left.push(x)}}

}

const giOpen=(p,i)=>i.status==='open'&&issueRes(p,i)?.status!=='resolved';
const openGeneral=p=>(p.fb.issues||[]).filter(i=>giOpen(p,i)).sort((a,b)=>(SEV_RANK[a.severity]??9)-(SEV_RANK[b.severity]??9));
const openCount=p=>openIssues(p).length+openGeneral(p).length;
function nextGiId(p){let n=0;for(const i of p.fb.issues||[]){const m=i.id.match(/^GI-(\d+)$/);if(m)n=Math.max(n,+m[1])}return 'GI-'+String(n+1).padStart(3,'0')}
function quote(s){return String(s||'').split(/\r?\n/).map(l=>'> '+l).join('\n')}
function attLinks(r){return (r.attachments||[]).map(n=>`[${n}](attachments/${encodeURI(n)})`).join(', ')}
function serializeFeedback(p){
  const R=p.fb.results;
  let o=FEEDBACK_NOTE+`\n# Feedback — ${projName(p)}\n\nUpdated: ${nowStamp()}\n\n## Summary\n\n| Batch | Tests | Pass | Partial | Fail | Blocked | Skipped | Needs retest | Untested |\n|---|---|---|---|---|---|---|---|---|\n`;
  for(const b of p.tests.batches){const c=batchStats(p,b);o+=`| ${b.version} | ${c.total} | ${c.pass} | ${c.partial} | ${c.fail} | ${c.blocked} | ${c.skipped} | ${c.retest} | ${c.untested} |\n`}
  const oi=openIssues(p);
  o+=`\n## Open issues (${oi.length})\n`;if(!oi.length)o+='\nNone.\n';
  for(const {t,r,res} of oi){
    o+=`\n### ${t.id} · ${t.title} — ${STATE_LABEL[r.state]}${r.severity?' · '+r.severity:''}\n`;
    o+=`Batch: ${t.batch} · Tested: ${r.updated||'?'}${t.feature?' · Feature: '+t.feature:''}${t.area?' · Area: '+t.area:''}\n`;
    if(res)o+=`Fix pending: ${res.by.id} (batch ${res.by.batch}) not yet passed\n`;
    o+=(r.notes?.trim()?quote(r.notes):'> (no notes)')+'\n';
    if(r.attachments?.length)o+=`Attachments: ${attLinks(r)}\n`;
  }
  const gis=p.fb.issues||[],gOpen=gis.filter(i=>giOpen(p,i)),gClosed=gis.filter(i=>!giOpen(p,i));
  o+=`\n## General issues (${gOpen.length} open)\n`;if(!gis.length)o+='\nNone.\n';
  for(const i of [...gOpen].sort((a,b)=>(SEV_RANK[a.severity]??9)-(SEV_RANK[b.severity]??9))){
    const res=issueRes(p,i);
    o+=`\n### ${i.id} · ${i.title} — ${i.kind||'Bug'}${i.severity?' · '+i.severity:''} · OPEN\n`;
    o+=`Raised: ${i.created||'?'}${i.updated&&i.updated!==i.created?' · Updated: '+i.updated:''}\n`;
    if(res)o+=`Fix pending: ${res.by.id} (batch ${res.by.batch}) not yet passed\n`;
    o+=(i.notes?.trim()?quote(i.notes):'> (no details)')+'\n';
    if(i.attachments?.length)o+=`Attachments: ${attLinks(i)}\n`;
  }
  if(gClosed.length){o+=`\nClosed:\n\n`;for(const i of gClosed){const res=issueRes(p,i);o+=`- ${i.id} · ${i.title} — ${res?.status==='resolved'?'RESOLVED by '+res.by.id:GI_STATUS[i.status]||i.status}\n`}}
  const rt=allTests(p).filter(t=>['retest','stale'].includes(effState(p,t)));
  o+=`\n## Needs retest (${rt.length})\n`;if(!rt.length)o+='\nNone.\n';else o+='\n';
  for(const t of rt){const r=R[t.id];o+=`- ${t.id} · ${t.title} (batch ${t.batch}) — ${effState(p,t)==='stale'?'test text changed after it was tested (was '+STATE_LABEL[r.state]+')':'flagged by tester'}${r.notes?.trim()?' — '+r.notes.trim().replace(/\s+/g,' '):''}\n`}
  const bs=allTests(p).filter(t=>['blocked','skipped'].includes(effState(p,t)));
  o+=`\n## Blocked / skipped (${bs.length})\n`;if(!bs.length)o+='\nNone.\n';else o+='\n';
  for(const t of bs){const r=R[t.id];o+=`- ${t.id} · ${t.title} (batch ${t.batch}) — ${STATE_LABEL[r.state]}${r.notes?.trim()?' — '+r.notes.trim().replace(/\s+/g,' '):''}\n`}
  const reqs=allFeatures(p.features).filter(f=>/user/i.test(f.source));
  o+=`\n## Feature requests (${reqs.length})\n`;if(!reqs.length)o+='\nNone.\n';else o+='\nDetails are in FEATURES.md.\n\n';
  for(const f of reqs)o+=`- ${f.id} · ${f.title} [${f.stage}]\n`;
  o+=`\n## Results by batch\n`;
  for(const b of p.tests.batches){
    const done=b.tests.filter(t=>effState(p,t)!=='untested');
    o+=`\n### Batch ${b.version}\n\n`;if(!done.length){o+='No results yet.\n';continue}
    for(const t of done){const r=R[t.id],s=effState(p,t),res=(s==='fail'||s==='partial')?resolution(p,t):null;
      o+=`- **${STATE_LABEL[s]}**${r.severity&&(s==='fail'||s==='partial')?' ('+r.severity+')':''} ${t.id} · ${t.title} — ${r.updated||''}${res?(res.status==='resolved'?' — RESOLVED by '+res.by.id:' — fix pending: '+res.by.id):''}\n`;
      if(r.notes?.trim())o+=r.notes.trim().split(/\r?\n/).map(l=>'  > '+l).join('\n')+'\n';
      if(r.attachments?.length)o+=`  Attachments: ${attLinks(r)}\n`;
    }
  }
  const known=new Set(allTests(p).map(t=>t.id));const orphans=Object.keys(R).filter(k=>!known.has(k)&&R[k].state);
  if(orphans.length){o+=`\n## Results for tests no longer in TESTS.md\n\n`;for(const k of orphans)o+=`- ${k} · ${R[k].title||''} — ${STATE_LABEL[R[k].state]||R[k].state}\n`}
  const json=JSON.stringify({version:1,results:R,issues:p.fb.issues||[]},null,1).replace(/-->/g,'--\\u003e');
  return o+`\n<!-- PROJ-MGMT-DATA\n${json}\nPROJ-MGMT-DATA -->\n`;
}

async function readFile(dir,name){
  try{const fh=await dir.getFileHandle(name);const f=await fh.getFile();return {text:await f.text(),mtime:f.lastModified}}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e}
}
async function writeFile(dir,name,data){
  const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(data);await w.close();
  return (await fh.getFile()).lastModified;
}
async function copyDir(src,dst){
  for await(const [n,e] of src.entries()){
    if(e.kind==='file')await writeFile(dst,n,await e.getFile());
    else await copyDir(e,await dst.getDirectoryHandle(n,{create:true}));
  }
}
async function perm(hd){if(!hd)return 'missing';if(!hd.queryPermission)return 'granted';try{return await hd.queryPermission({mode:'readwrite'})}catch{return 'prompt'}}

/* ---------------- onboarding projects that existed before Workbench ---------------- */
function idPrefix(name){
  const w=String(name||'').replace(/([a-z])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9]+/).filter(Boolean);
  let p=w.length>1?w.map(x=>x[0]).join(''):(w[0]||'T').slice(0,3);
  p=p.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  return /^[A-Z]/.test(p)?p:'T'+p;
}
/* Reads checklist-style test lists: "## <version>" headings, "- [ ] item" / "- [x] item", optional "Feedback: ..." sub-lines. */
function parseChecklist(text){
  const batches=[];let b=null,last=null;
  for(const raw of String(text||'').split(/\r?\n/)){
    let mm;
    if((mm=raw.match(/^#{2,4}\s+(.*)$/))){b={version:mm[1].replace(/\((current|latest|new)\)/ig,'').replace(/^Batch\s+/i,'').trim()||'Imported',notes:[],items:[]};batches.push(b);last=null;continue}
    if((mm=raw.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){if(!b){b={version:'Imported',notes:[],items:[]};batches.push(b)}last={done:mm[1]!==' ',text:mm[2].trim(),fb:''};b.items.push(last);continue}
    if(last&&(mm=raw.match(/^\s*(?:[-*]\s+)?Feedback:\s*(.*)$/i))){last.fb=mm[1].trim();continue}
    if(last&&/^\s{2,}\S/.test(raw)){last.text+=' '+raw.trim();continue}
    if(b&&!b.items.length&&raw.trim())b.notes.push(raw.trim());
  }
  return batches.filter(x=>x.items.length);
}
function checklistToTests(name,batches,prefix){
  const idmap=new Map();let n=0;
  for(const b of [...batches].reverse())for(const it of b.items)idmap.set(it,`${prefix}-${String(++n).padStart(3,'0')}`);
  let o=TESTS_NOTE+`\n# Tests — ${name}\n`;
  for(const b of batches){
    o+=`\n## Batch ${b.version}\n`;if(b.notes.length)o+=b.notes.join('\n')+'\n';
    for(const it of b.items){
      const parts=it.text.split(/\s+[-–—]\s+/);let title=parts[0].replace(/\s+/g,' '),exp=parts.slice(1).join(' - ');
      if(title.length>90){exp=it.text;title=title.slice(0,80).replace(/\s+\S*$/,'')+'…'}
      o+=`\n### ${idmap.get(it)} · ${title}\n${exp?`Expected: ${exp}\n`:''}`;
    }
  }
  return {text:o,idmap};
}
async function scanLegacy(p){
  const found=[];
  const scan=async(dir,prefix,depth)=>{for await(const [n,e] of dir.entries()){
    if(e.kind==='directory'){if(depth<1&&/^(docs?|documentation|notes|planning|plans)$/i.test(n))await scan(e,prefix+n+'/',depth+1);continue}
    if(!/\.(md|markdown|txt)$/i.test(n))continue;
    const kind=/test|qa|checklist|verif/i.test(n)?'testing':/plan|roadmap|todo|feature|design|spec|backlog|idea/i.test(n)?'planning':/readme|changelog|claude|agents?\.md|notes/i.test(n)?'info':null;
    if(kind)found.push({path:prefix+n,kind,handle:e});
  }};
  if(p.handle.name!=='proj_management')await scan(p.handle,'',0);
  return found;
}
function setupDoc(p,docs,imported){
  const list=docs.length?docs.map(d=>`- ${d.path} (${d.kind})`).join('\n'):'- (none found)';
  return `<!-- PROJ-MGMT:SETUP v1
AGENT INSTRUCTIONS - One-time setup. Do the steps below, then DELETE this file.
Workbench shows "waiting for agent setup" on this project until the file is gone.
-->
# Agent setup — ${projName(p)}

This project was just added to Workbench. \`proj_management/\` now holds:
- TESTS.md: you write test batches here (format in its top comment)
- FEATURES.md: features by area and stage, shared with the human
- FEEDBACK.md: the human's results and notes (read-only for you)
- DECISIONS.md: questions you need the human to decide, with your research and options
- IDEAS.md: the human's not-yet-committed ideas; act only on [Ready] ones

## Never overwrite these files
These files already exist and may hold the human's work, even if you haven't seen them before.
- Before creating any proj_management file, check whether it exists. If it does, READ it and EDIT it (add to it); never replace it with a fresh file.
- Create a file only when it is truly missing, and start it with the header comment from PROJ_MANAGEMENT_SPEC.md.
- Edit in place: change only the lines you mean to change and keep everything else (other ideas, decisions, features, the human's notes).
- Workbench saves a copy in proj_management/history/ when a file loses entries, but don't rely on that.

## Do once
1. Read the existing docs listed below.
2. Move planned, in-progress and finished features into FEATURES.md (areas, IDs, stages: Ideated, Designed, Testing, Iterating, Completed). Keep the human's Status line.
3. ${imported?`Tests from ${imported.path} were imported into TESTS.md (${imported.count} tests; ticked items became PASS results). Tidy any awkward titles, add Area:/Feature: links where obvious, and write future batches to TESTS.md instead of ${imported.path}.`:'If any doc below holds a test checklist, convert its open items into a "## Batch <version>" in TESTS.md.'}
4. Update your own project notes (CLAUDE.md, build plan, etc.) so future sessions know testing and features are tracked in proj_management/.
5. Delete this file.

## Existing docs found
${list}
`;
}
async function onboardProject(p,{fresh}){
  const docs=await scanLegacy(p);let imported=null;
  if(!allTests(p).length){
    for(const d of docs.filter(x=>x.kind==='testing')){
      const f=await d.handle.getFile();if(f.size>3e6)continue;
      const batches=parseChecklist(await f.text()),count=batches.reduce((a,b)=>a+b.items.length,0);
      if(!count)continue;
      if(!await confirmBox(`Found ${d.path} with ${count} test items in ${batches.length} batch${batches.length>1?'es':''}. Import them into proj_management/TESTS.md? Ticked items become PASS and any “Feedback:” lines become notes. The original file is left untouched.`,'Import'))continue;
      const {text,idmap}=checklistToTests(projName(p),batches,idPrefix(projName(p)));
      p.mt.tests=await writeFile(p.pm,'TESTS.md',text);p.tests=parseTests(text);
      for(const b of batches)for(const it of b.items){
        if(!it.done&&!it.fb)continue;const t=allTests(p).find(x=>x.id===idmap.get(it));if(!t)continue;
        const r=touch(p,t);if(it.done)r.state='pass';if(it.fb)r.notes=it.fb;r.updated='imported';
      }
      await saveFeedbackNow(p);imported={path:d.path,count};break;
    }
  }
  if(fresh||imported){await writeFile(p.pm,'AGENT_SETUP.md',setupDoc(p,docs,imported));p.setupPending=true}
  return imported;
}

/* Safety net: if someone else's edit removes entries, keep the previous version in proj_management/history/. */
const ENTRY_IDS={features:t=>allFeatures(parseFeatures(t)).map(x=>x.id),tests:t=>parseTests(t).batches.flatMap(b=>b.tests).map(x=>x.id),
  decisions:t=>parseDecisions(t).items.map(x=>x.id),ideas:t=>parseIdeas(t).items.map(x=>x.id)};
async function guardLoss(p,k,file,text){
  const old=p.raw?.[k];(p.raw=p.raw||{})[k]=text;if(!old||!ENTRY_IDS[k])return '';
  const now=new Set(ENTRY_IDS[k](text)),gone=ENTRY_IDS[k](old).filter(id=>!now.has(id));if(!gone.length)return '';
  try{const hd=await p.pm.getDirectoryHandle('history',{create:true});const stamp=nowStamp().replace(/[: ]/g,'-');
    const name=file.replace('.md','')+'-before-'+stamp+'.md';await writeFile(hd,name,old);
    return `⚠ ${projName(p)}: ${file} lost ${gone.length} entr${gone.length>1?'ies':'y'} (${gone.slice(0,4).join(', ')}${gone.length>4?'…':''}). The previous version is saved in proj_management/history/${name}`;
  }catch(e){console.warn(e);return `⚠ ${projName(p)}: ${file} lost ${gone.length} entr${gone.length>1?'ies':'y'} (${gone.slice(0,4).join(', ')})`}
}

async function squareImage(file,size){

  const sc=Math.max(size/bmp.width,size/bmp.height),w=bmp.width*sc,hh=bmp.height*sc;x.imageSmoothingQuality='high';x.drawImage(bmp,(size-w)/2,(size-hh)/2,w,hh);

/* ---------------- auto-growing text boxes ----------------
   auto : grows with the text up to 8 lines, then scrolls
   grow : user dragged it taller -> keeps growing to fit, no limit
   fixed: user dragged it shorter -> stays exactly that size
   Remembered per box (data-k) while the app is open. */
S.ta={};
function taFit(el){
  const k=el.dataset.k;if(!k)return;const st=S.ta[k]||(S.ta[k]={mode:'auto'});
  if(st.mode==='fixed'){el.style.height=st.h+'px';st.last=el.offsetHeight;return}
  const cs=getComputedStyle(el),lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5;
  const frame=el.offsetHeight-el.clientHeight,pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const max=Math.ceil(lh*8+pad+frame),top=el.scrollTop;
  el.style.height='auto';const need=el.scrollHeight+frame;
  if(st.mode==='grow'){if(need>max)st.over=true;else if(st.over){st.mode='auto';st.over=false}}
  const hgt=st.mode==='grow'?Math.max(st.h,need):Math.min(need,max);
  el.style.height=hgt+'px';el.scrollTop=top;st.last=el.offsetHeight;
}
let taDrag=null;
document.addEventListener('pointerdown',e=>{const el=e.target;if(el.tagName==='TEXTAREA'&&el.dataset.k)taDrag={el,h0:el.offsetHeight}},true);
document.addEventListener('pointerup',()=>{
  if(!taDrag)return;const {el,h0}=taDrag;taDrag=null;
  const h1=el.offsetHeight,st=S.ta[el.dataset.k]||(S.ta[el.dataset.k]={mode:'auto'});
  if(Math.abs(h1-h0)<2)return;                    // a click, not a resize
  if(h1>h0){st.mode='grow';st.h=h1;taFit(el)}     // made bigger: keep fitting the text
  else{st.mode='fixed';st.h=h1}                   // made smaller: stay put
},true);

function nextUnresolved(dir=1){

/* ---------------- watch files for agent changes ---------------- */
async function poll(){
  if(document.hidden||S.polling)return;S.polling=true;const msgs=[];let go=null;
  try{
    for(const p of S.projects){
      if(!p.loaded)continue;
      const sp=await p.pm.getFileHandle('AGENT_SETUP.md').then(()=>true,()=>false);
      if(sp!==!!p.setupPending){p.setupPending=sp;if(!sp)msgs.push(`${projName(p)}: agent finished setup`)}
      for(const [k,file] of [['tests','TESTS.md'],['features','FEATURES.md'],['decisions','DECISIONS.md'],['ideas','IDEAS.md']]){
        let f;try{f=await (await p.pm.getFileHandle(file)).getFile()}catch{continue}
        if(f.lastModified===p.mt[k])continue;
        const text=await f.text();p.mt[k]=f.lastModified;
        const lost=await guardLoss(p,k,file,text);if(lost)msgs.push(lost);
        p._agentTouched=true;
        if(k==='tests'){const beforeB=new Set(p.tests.batches.map(b=>b.version)),before=new Set(allTests(p).map(t=>t.id));p.tests=parseTests(text);const addedT=allTests(p).filter(t=>!before.has(t.id)),added=addedT.length;if(added)reactivate(p,'new tests were added');
          const nb=p.tests.batches.find(b=>!beforeB.has(b.version));
          if(nb){msgs.push(`${projName(p)}: new test batch ${nb.version} (${nb.tests.length} test${nb.tests.length===1?'':'s'})`);go=go||{pid:p.id,tab:'testing',tsub:'batches',batch:nb.version,filter:'todo',label:'Start testing'}}
          else{msgs.push(`${projName(p)}: TESTS.md updated${added?` (+${added} test${added>1?'s':''})`:''}`);if(added)go=go||{pid:p.id,tab:'testing',tsub:'batches',batch:addedT[0].batch,filter:'todo',label:'Show'}}
          queueFeedbackSave(p)}
        else if(k==='ideas'){const before=new Set((p.ideas?.items||[]).map(x=>x.id));p.ideas=parseIdeas(text);const n=p.ideas.items.filter(x=>!before.has(x.id)).length;const pr=p.ideas.items.filter(x=>x.status==='Promoted'&&x.became).length;
          msgs.push(`${projName(p)}: ${n?n+' new idea'+(n>1?'s':''):'IDEAS.md updated'}`);if(n)go=go||{pid:p.id,tab:'ideas',ifilter:'open',label:'Show ideas'}}
        else if(k==='decisions'){const before=new Set((p.dec?.items||[]).map(d=>d.id));p.dec=parseDecisions(text);const n=p.dec.items.filter(d=>!before.has(d.id)&&d.status==='Open').length;if(n){reactivate(p,'a new decision was added');go=go||{pid:p.id,tab:'decisions',dfilter:'open',label:'Decide'}}msgs.push(`${projName(p)}: ${n>0?n+' new decision'+(n>1?'s':'')+' to make':'DECISIONS.md updated'}`)}
        else{const before=new Set(allFeatures(p.features).map(f=>f.id));p.features=parseFeatures(text);if(allFeatures(p.features).some(f=>!before.has(f.id)))reactivate(p,'a new feature was added');msgs.push(`${projName(p)}: FEATURES.md updated`)}
      }
    }
  }catch(e){console.warn(e)}finally{S.polling=false}
  if(S.ws&&S.nb.loaded){const sig=S.nb.topics.map(t=>t.file+t.mtime).join();await loadNotebook().catch(()=>{});if(sig!==S.nb.topics.map(t=>t.file+t.mtime).join()&&S.view.page==='notebook')requestRender()}
  for(const p of S.projects)if(p.loaded&&p.pm){const old=p.iconSig;await loadIcon(p).catch(()=>{});if(p.iconSig!==old)requestRender()}
  for(const p of S.projects)if(p._agentTouched){p._agentTouched=false;trackActivity(p,'agent')}
  if(msgs.length){toast(msgs.join(' · '),go);requestRender()}
}

/* ---------- TEST-RUN MODE (experimental) ---------- */
function runEnabled(){return S.set.exp_run!=='off'}
function startRun(p){
  const v=S.view,bs=p.tests.batches;if(!bs.length)return;
  const bsel=v.batch&&v.batch!=='*'?v.batch:null;
  const pool=(bsel?bs.filter(b=>b.version===bsel):bs).flatMap(b=>b.tests);
  let ids=sortTests([...pool],v.order).filter(t=>['untested','retest','stale'].includes(effState(p,t))).map(t=>t.id);
  if(!ids.length){toast('Nothing left to test here. Pick another batch or "All batches".');return}
  S.run={pid:p.id,ids,i:0,batch:bsel||'*',start:Date.now()};render();scrollTo(0,0);
}
function runTest(p){return S.run?allTests(p).find(t=>t.id===S.run.ids[S.run.i]):null}
function runStats(p){const c={done:0,pass:0,partial:0,fail:0,blocked:0,skipped:0,retest:0,left:0};
  for(const id of S.run.ids){const t=allTests(p).find(x=>x.id===id);const s=t?effState(p,t):'untested';if(s==='untested'||s==='stale'||s==='retest')c.left++;else{c.done++;c[s]=(c[s]||0)+1}}return c}
function renderRun(p){
  const R=S.run,t=runTest(p),c=runStats(p),n=R.ids.length,pct=Math.round(c.done/n*100);
  let o=`<div class="toolbar run-bar"><span class="chip st-Idea">${ic('flask')}Test run · beta</span><b>${R.batch==='*'?'All batches':'Batch '+h(R.batch)}</b>
    <span class="muted small">${R.i+1} of ${n} · ${c.done} marked · ${c.left} left</span><div class="tb-bar" style="flex:1">${pctBar(pct)}</div>
    <button data-act="run-exit">${ic('x')}Exit run</button></div>`;
  if(!t||(c.left===0&&R.finished)){
    return o+`<div class="panel run-done"><h2>${ic('check')} Run complete</h2><p>${c.done} of ${n} tests marked: <b class="c-pass">${c.pass} pass</b> · <b class="c-partial">${c.partial} partial</b> · <b class="c-fail">${c.fail} fail</b> · ${c.blocked} blocked · ${c.skipped} skipped · ${c.retest} needs retest.</p>
      <div class="form-row"><button class="primary" data-act="run-exit">Back to the list</button><button data-act="review-prompt" data-pid="${h(p.id)}">${ic('clip')}Copy review prompt</button>${R.batch!=='*'?`<button data-act="batch-report" data-pid="${h(p.id)}" data-batch="${h(R.batch)}">${ic('layers')}Batch report</button>`:''}</div></div>`;
  }
  o+=`<div class="run-nav"><button data-act="run-step" data-d="-1" ${R.i===0?'disabled':''}>${ic('back')}Previous <kbd>←</kbd></button>
    <span class="muted small run-keys"><kbd>P</kbd> pass · <kbd>A</kbd> partial · <kbd>F</kbd> fail · <kbd>B</kbd> blocked · <kbd>S</kbd> skip · <kbd>R</kbd> retest · <kbd>1</kbd>–<kbd>4</kbd> severity · <kbd>Esc</kbd> exit</span>
    <button data-act="run-step" data-d="1">${R.i===n-1?'Finish':'Next'} <kbd>→</kbd>${ic('chevR')}</button></div>`;
  o+=`<div class="run-card">${t.batch&&R.batch==='*'?`<div class="muted small" style="margin-bottom:4px">Batch ${h(t.batch)}</div>`:''}${testCard(p,t)}</div>`;
  return o;
}
function runStep(d){
  const p=getP(S.run.pid);const n=S.run.ids.length;
  if(d>0&&S.run.i>=n-1){S.run.finished=true;render();return}
  S.run.i=Math.max(0,Math.min(n-1,S.run.i+d));S.run.finished=false;render();
}
function runMark(state){
  const p=getP(S.run.pid),t=runTest(p);if(!t)return;
  const r=touch(p,t);r.state=state;if(state==='fail'||state==='partial'){if(!r.severity)r.severity='Minor'}else r.severity='';
  queueFeedbackSave(p);render();
  if(state==='fail'||state==='partial'){const ta=document.querySelector(`textarea[data-in="notes"][data-id="${CSS.escape(t.id)}"]`);ta?.focus()}
  else{clearTimeout(S.runT);S.runT=setTimeout(()=>{if(S.run&&runTest(p)?.id===t.id)runStep(1)},380)}
}
document.addEventListener('keydown',e=>{
  if(!S.run||S.view.page!=='project'||S.view.pid!==S.run.pid||S.view.tab!=='testing')return;
  const tg=e.target,typing=tg&&(tg.tagName==='TEXTAREA'||tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.isContentEditable);
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();if(typing){tg.blur();return}A['run-exit']();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open],sl-dialog[open]'))return;
  const k=e.key.toLowerCase(),map={p:'pass',a:'partial',f:'fail',b:'blocked',s:'skipped',r:'retest'};
  if(map[k]&&!e.shiftKey){e.preventDefault();runMark(map[k]);return}
  if(['1','2','3','4'].includes(k)){const p=getP(S.run.pid),t=runTest(p),r=t&&p.fb.results[t.id];if(r&&(r.state==='fail'||r.state==='partial')){e.preventDefault();r.severity=['Cosmetic','Minor','Major','Critical'][+k-1];r.updated=nowStamp();queueFeedbackSave(p);render()}return}
  if(e.key==='ArrowRight'||(k==='n'&&!e.shiftKey)){e.preventDefault();runStep(1);return}
  if(e.key==='ArrowLeft'||(k==='n'&&e.shiftKey)){e.preventDefault();runStep(-1);return}
},true);

/* ---------- SEARCH across projects (Ctrl+K) ---------- */
function searchIndex(scope){
  const out=[],L=layout();
  for(const p of S.projects){
    if(!p.loaded)continue;
    if(scope&&scope!=='*'){if(scope.startsWith('p:')){if(scope.slice(2)!==p.id)continue}else if(groupOf(p)!==scope)continue}
    const add=(type,id,title,text,go,hl)=>out.push({p,type,id,title,text:(title+'\n'+text).toLowerCase(),raw:text,go,hl});
    add('project','',projName(p),p.features.summary||'',{tab:'overview'},null);
    for(const t of allTests(p)){const r=p.fb.results[t.id];add('test',t.id,t.title,[t.setup,...t.steps,t.expected,...t.desc,r?.notes||''].join('\n'),{tab:'testing',tsub:'batches',batch:t.batch,filter:'all'},'t-'+t.id)}
    for(const i of p.fb.issues||[])add('issue',i.id,i.title,i.notes||'',{tab:'testing',tsub:'issues',gfilter:'all'},'t-'+i.id);
    for(const d of p.dec?.items||[])add('decision',d.id,d.title,[...d.details,...d.options.map(x=>x.text),d.decision,...d.notes].join('\n'),{tab:'decisions',dfilter:'all'},'d-'+d.id);
    for(const i of p.ideas?.items||[])add('idea',i.id,i.title,i.details.join('\n'),{tab:'ideas',ifilter:'all'},'i-'+i.id);
    for(const f of allFeatures(p.features))add('feature',f.id,f.title,[...f.desc,...f.parts.map(x=>x.text)].join('\n'),{tab:'features'},'f-'+f.id);
  }
  return out;
}
const TYPE_ICON={project:'folder',test:'flask',issue:'alert',decision:'scale',idea:'bulb',feature:'layers'};
function snippet(raw,q){
  const s=String(raw||'').replace(/\s+/g,' ').trim();if(!s)return '';const i=s.toLowerCase().indexOf(q);
  const a=Math.max(0,i-50),part=(a?'…':'')+s.slice(a,a+140)+(a+140<s.length?'…':'');
  return i<0?h(s.slice(0,120)):h(part).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/&/g,'&amp;').replace(/</g,'&lt;'),'ig'),m=>`<mark>${m}</mark>`);
}

  const oi=openIssues(p);if(oi.length)lines.push(`- Open issues: ${oi.slice(0,12).map(x=>`${x.t.id} (${x.r.severity||x.r.state})`).join(', ')}${oi.length>12?` and ${oi.length-12} more`:''}.`);
  const og=openGeneral(p);if(og.length)lines.push(`- Open general issues: ${og.map(i=>`${i.id} (${i.severity})`).join(', ')}.`);
  const dec=(p.dec?.items||[]).filter(d=>d.status==='Decided').slice(-6);if(dec.length)lines.push(`- Decisions I've answered (act on any you haven't yet): ${dec.map(d=>d.id).join(', ')}.`);
  const ready=(p.ideas?.items||[]).filter(i=>i.status==='Ready');if(ready.length)lines.push(`- Ideas marked Ready: ${ready.map(i=>i.id).join(', ')}.`);

  lines.push('','Fix what you can, then add a new test batch to TESTS.md with a Retests: line for each fix, update feature stages, act on decided decisions and Ready ideas, and add decisions for anything you need me to choose. Read FEEDBACK.md (and attachments/) for my notes. Never overwrite proj_management files; edit them in place.');

}

/* ---------- BATCH REPORT (idea 8) ---------- */
function batchReport(p,ver){
  const b=p.tests.batches.find(x=>x.version===ver);if(!b)return '';const c=batchStats(p,b),R=p.fb.results;
  const st=t=>effState(p,t),line=t=>{const r=R[t.id]||{},n=(r.notes||'').trim().split(/\r?\n/)[0];return `- ${t.id} · ${t.title}${n?` — ${n}`:''}`};
  let o=`# ${projName(p)} — batch ${ver} test report\n\nBatch date: ${b.date||'—'} · Report: ${nowStamp().slice(0,10)}\n\n**${c.total} tests:** ${c.pass} pass · ${c.partial} partial · ${c.fail} fail · ${c.blocked} blocked · ${c.skipped} skipped · ${c.retest} needs retest · ${c.untested} untested\n`;
  if(b.notes.length)o+=`\n${b.notes.join('\n')}\n`;
  const issues=b.tests.filter(t=>['fail','partial'].includes(st(t)));
  if(issues.length){o+=`\n## Issues found (${issues.length})\n\n`;for(const t of issues){const r=R[t.id];const res=resolution(p,t);o+=`- **${st(t).toUpperCase()}${r.severity?' · '+r.severity:''}** ${t.id} · ${t.title}${res?.status==='resolved'?` (fixed: ${res.by.id} passed)`:''}\n`;if(r.notes?.trim())o+=r.notes.trim().split(/\r?\n/).map(l=>`  > ${l}`).join('\n')+'\n'}}
  const pass=b.tests.filter(t=>st(t)==='pass');if(pass.length)o+=`\n## Passed (${pass.length})\n\n${pass.map(line).join('\n')}\n`;
  const other=b.tests.filter(t=>!['pass','fail','partial'].includes(st(t)));if(other.length)o+=`\n## Not tested / blocked / skipped (${other.length})\n\n${other.map(t=>line(t)+` _(${STATE_LABEL[st(t)]})_`).join('\n')}\n`;
  const fids=[...new Set(b.tests.map(t=>t.feature).filter(Boolean))];
  if(fids.length){o+=`\n## Features covered\n\n`;for(const id of fids){const f=findFeat(p.features,id).f;if(f)o+=`- ${f.id} · ${f.title} — ${f.parts.length?Math.round(featPct(f))+'% (parts)':f.stage+' ('+STAGE_PCT[f.stage]+'%)'}\n`}}
  return o;
}

/* ---------- ACTIVITY HISTORY (idea 9) ---------- */
function actSnap(p){
  const s={batches:{},feats:{},decs:{},ideas:{},issues:{},res:{},titles:{}};
  const SL={pass:'Pass',partial:'Partial',fail:'Fail',blocked:'Blocked',skipped:'Skipped',retest:'Needs retest'};
  for(const t of allTests(p)){const r=p.fb.results[t.id];if(r&&r.state){s.res[t.id]=SL[r.state]+(r.severity&&(r.state==='fail'||r.state==='partial')?' ('+r.severity+')':'');s.titles[t.id]=t.title}}
  for(const b of p.tests.batches){const c=batchStats(p,b);s.batches[b.version]={total:c.total,done:c.done,pass:c.pass,partial:c.partial,fail:c.fail}}
  for(const f of allFeatures(p.features)){s.feats[f.id]=f.parts.length?Math.round(featPct(f))+'%':f.stage;s.titles[f.id]=f.title}
  for(const d of p.dec?.items||[]){s.decs[d.id]=d.status;s.titles[d.id]=d.title}
  for(const i of p.ideas?.items||[]){s.ideas[i.id]=i.status+(i.became?' → '+i.became:'');s.titles[i.id]=i.title}
  for(const i of p.fb.issues||[]){const r=issueRes(p,i);s.issues[i.id]=r?.status==='resolved'?'resolved':i.status;s.titles[i.id]=i.title}
  return s;
}
function actDiff(a,b){
  const ev=[],T=id=>b.titles[id]||a.titles?.[id]||'';
  for(const v in b.batches){const o=a.batches?.[v],n=b.batches[v];
    if(!o)ev.push({kind:'batch',ref:{type:'batch',id:v},text:`New test batch ${v} (${n.total} test${n.total===1?'':'s'})`});
    else{if(n.total>o.total)ev.push({kind:'batch',ref:{type:'batch',id:v},text:`${n.total-o.total} test${n.total-o.total>1?'s':''} added to batch ${v}`});
      if(n.done===n.total&&n.total&&o.done<o.total)ev.push({kind:'batch',ref:{type:'batch',id:v},text:`Finished testing batch ${v}: ${n.pass} pass, ${n.partial} partial, ${n.fail} fail`})}}
  const pairs=[['res','test','r'],['feats','feature','f'],['decs','decision','d'],['ideas','idea','i'],['issues','issue','t']];
  for(const [k,type] of pairs){
    for(const id in b[k]){const o=a[k]?.[id],n=b[k][id];
      if(o==null)ev.push({kind:type,ref:{type,id},text:type==='test'?`${id} · ${T(id)}: marked ${n}`:`New ${type} ${id} · ${T(id)}${type==='feature'?` [${n}]`:''}`});
      else if(o!==n)ev.push({kind:type,ref:{type,id},text:`${id} · ${T(id)}: ${o} → ${n}`})}
    for(const id in a[k]||{})if(!(id in b[k]))ev.push(type==='test'?{kind:type,ref:{type,id},text:`${id} · ${T(id)}: result cleared`}:{kind:type,ref:{type,id},text:`${type[0].toUpperCase()+type.slice(1)} ${id} · ${T(id)} was removed`,warn:true});
  }
  return ev;
}
async function loadActivity(p){

  try{const hd=await p.pm.getDirectoryHandle('history',{create:true});const f=await readFile(hd,'activity.json');if(f)p.act=JSON.parse(f.text)}catch(e){console.warn('activity',e)}

}
function trackActivity(p,who){
  if(!p.act||!p.loaded)return;
  const now=actSnap(p);
  if(!p.act.snap){p.act.snap=now;p.act.events.push({t:nowStamp(),who:'app',kind:'start',text:'Workbench started keeping this history'});saveActivity(p);return}
  const ev=actDiff(p.act.snap,now);p.act.snap=now;if(!ev.length)return;
  const t=nowStamp();for(const e of ev)p.act.events.push({t,who,...e});
  if(p.act.events.length>3000)p.act.events=p.act.events.slice(-3000);
  saveActivity(p);
}
function saveActivity(p){clearTimeout(p._actT);p._actT=setTimeout(async()=>{try{const hd=await p.pm.getDirectoryHandle('history',{create:true});await writeFile(hd,'activity.json',JSON.stringify(p.act))}catch(e){console.warn(e)}},800)}
const WHO_LABEL={you:'you',agent:'agent / outside Workbench',away:'while Workbench was closed',app:'Workbench'};
function renderHistory(p){

    <span class="muted small">What changed and when, recorded by Workbench in <code>proj_management/history/activity.json</code>.</span></div>`;
  if(!ev.length)return o+`<div class="empty">Nothing recorded yet. Changes made from now on (by you, by agents, or while Workbench was closed) will show here.</div>`;
  let day='';o+='<div class="panel hist">';

    const icon={test:'check',batch:'flask',feature:'layers',decision:'scale',idea:'bulb',issue:'alert',start:'check'}[e.kind]||'dot';

function histGo(p,type,id){

/* ---------------- Notebook: topics with tasks, links and notes (workspace/notebook/*.md) ---------------- */
const NB_STATUSES=['Open','Waiting','Done'];
const NB_NOTE=`<!-- PROJ-MGMT:NOTEBOOK v1
A Workbench notebook topic. The human edits it in Workbench; agents may read it and, only when asked, add tasks, links or notes.
NEVER REPLACE THIS FILE: read it and edit it in place, keeping everything you don't mean to change.
Header lines: Status (Open | Waiting | Done), Tags (comma separated), Created, Updated, Attachments (written by Workbench).
## Tasks: "- [ ] text" open, "- [x] text" done, "- [3/10] text" a counter (current/target). "### Name" lines group the tasks below them.
## Links: "- [Title](url)". Workbench item links start with "#project/".
## Notes: free Markdown.
-->`;
const nbDate=()=>nowStamp().slice(0,10);
function parseTopic(text,file){
  const t={file,slug:file.replace(/\.md$/i,''),title:file.replace(/\.md$/i,''),status:'Open',tags:[],created:'',updated:'',attachments:[],groups:[{name:'',tasks:[]}],links:[],notes:'',extra:[]};
  let sec='head',inNote=false;const notes=[];
  for(const line of String(text).replace(/\r/g,'').split('\n')){
    if(inNote){if(line.includes('-->'))inNote=false;continue}
    if(/^\s*<!--/.test(line)){if(!line.includes('-->'))inNote=true;continue}
    let m;
    if(sec==='head'&&(m=line.match(/^#\s+(.+)/))){t.title=m[1].trim();continue}
    if((m=line.match(/^##\s+(.+?)\s*$/))){const k=m[1].toLowerCase();sec=k==='tasks'?'tasks':k==='links'?'links':k==='notes'?'notes':'extra';if(sec==='extra')t.extra.push(line);continue}
    if(sec==='head'){if((m=line.match(/^(Status|Tags|Created|Updated|Attachments):\s*(.*)$/i))){const k=m[1].toLowerCase(),v=m[2].trim();
        if(k==='status')t.status=NB_STATUSES.find(s=>s.toLowerCase()===v.toLowerCase())||'Open';
        else if(k==='tags')t.tags=v.split(',').map(x=>x.trim()).filter(Boolean);
        else if(k==='attachments')t.attachments=[...v.matchAll(/\[([^\]]+)\]\(/g)].map(x=>x[1]);
        else t[k]=v}continue}
    if(sec==='tasks'){
      if((m=line.match(/^###\s+(.+?)\s*$/))){t.groups.push({name:m[1],tasks:[]});continue}
      if((m=line.match(/^\s*[-*]\s+\[( |x|X|\d+\s*\/\s*\d+)\]\s?(.*)$/))){const g=t.groups[t.groups.length-1],b=m[1];
        const c=b.match(/(\d+)\s*\/\s*(\d+)/);g.tasks.push(c?{text:m[2],cur:+c[1],max:+c[2]}:{text:m[2],done:/x/i.test(b)});continue}
      continue}
    if(sec==='links'){if((m=line.match(/^\s*[-*]\s+\[([^\]]*)\]\((.*)\)\s*$/)))t.links.push({title:m[1],url:m[2].trim()});continue}
    if(sec==='notes'){notes.push(line);continue}
    if(sec==='extra')t.extra.push(line);
  }
  t.notes=notes.join('\n').replace(/^\n+|\n+$/g,'');
  if(t.groups.length>1&&!t.groups[0].tasks.length)t.groups.shift();
  return t;
}
function serializeTopic(t){
  let o=`${NB_NOTE}\n# ${t.title}\n\nStatus: ${t.status}\nTags: ${t.tags.join(', ')}\nCreated: ${t.created||nbDate()}\nUpdated: ${t.updated||nbDate()}\n`;
  if(t.attachments.length)o+=`Attachments: ${t.attachments.map(n=>`[${n}](attachments/${encodeURI(n)})`).join(', ')}\n`;
  o+='\n## Tasks\n';
  t.groups.forEach((g,i)=>{if(g.name||i>0)o+=`\n### ${g.name||'Tasks'}\n`;for(const k of g.tasks)o+=`- [${k.max!=null?`${k.cur||0}/${k.max}`:k.done?'x':' '}] ${k.text.replace(/\n/g,' ')}\n`});
  o+='\n## Links\n';for(const l of t.links)o+=`- [${l.title.replace(/[\[\]]/g,'')}](${l.url})\n`;
  o+=`\n## Notes\n${t.notes?t.notes+'\n':''}`;
  if(t.extra.length)o+='\n'+t.extra.join('\n').replace(/\n+$/,'')+'\n';
  return o;
}
const taskDone=k=>k.max!=null?(k.cur||0)>=k.max:!!k.done;
function topicStats(t){const all=t.groups.flatMap(g=>g.tasks);return {total:all.length,done:all.filter(taskDone).length}}
S.nb={topics:[],loaded:false};
async function nbDir(create=true){return S.ws?S.ws.getDirectoryHandle('notebook',{create}):null}
async function loadNotebook(){
  if(!S.ws)return;const dir=await nbDir();const seen=new Set();
  for await(const [n,e] of dir.entries()){if(e.kind!=='file'||!/\.md$/i.test(n))continue;seen.add(n);
    const f=await e.getFile();const cur=S.nb.topics.find(x=>x.file===n);
    if(cur&&cur.mtime===f.lastModified)continue;
    if(cur&&cur._dirty)continue; // our own unsaved edits win; they are written next
    const t=parseTopic(await f.text(),n);t.mtime=f.lastModified;
    if(cur)Object.assign(cur,t);else S.nb.topics.push(t)}
  S.nb.topics=S.nb.topics.filter(t=>seen.has(t.file)||t._dirty);S.nb.loaded=true;
}

function saveTopic(t,now){t._dirty=true;clearTimeout(t._sv);const go=async()=>{try{t.updated=nbDate();const dir=await nbDir();t.mtime=await writeFile(dir,t.file,serializeTopic(t));t._dirty=false;const s=$('#nbSaving');if(s){s.textContent='Saved';setTimeout(()=>{if(s.textContent==='Saved')s.textContent=''},1200)}}catch(e){toast('Could not save '+t.file+': '+e.message)}};
  const s=$('#nbSaving');if(s)s.textContent='Saving…';if(now)return go();t._sv=setTimeout(go,600)}

    <div class="pills">${t.links.length?`<span>${ic('link')}${t.links.length} link${t.links.length>1?'s':''}</span>`:''}${t.notes?`<span>${ic('edit')}notes</span>`:''}${t.attachments.length?`<span>${ic('image')}${t.attachments.length}</span>`:''}<span class="muted">${h(t.updated||t.created||'')}</span></div></article>`}).join('')}</div>`;

async function nbAttUrl(n){const k='nb|'+n;if(S.urls[k])return S.urls[k];const d=await (await nbDir()).getDirectoryHandle('attachments');return S.urls[k]=URL.createObjectURL(await (await d.getFileHandle(n)).getFile())}
function loadNbThumbs(){document.querySelectorAll('img[data-nbatt]').forEach(async img=>{try{const u=await nbAttUrl(img.dataset.nbatt);img.src=u;const a=img.closest('a');if(a)a.href=u}catch{img.alt='missing: '+img.dataset.nbatt}})}
async function nbAddFiles(t,files){
  const d=await (await nbDir()).getDirectoryHandle('attachments',{create:true});
  for(const f of files){const ext=(f.name.match(/\.[a-z0-9]+$/i)||['.png'])[0].toLowerCase();let n=`${t.slug}-${Date.now().toString(36)}${ext}`;await writeFile(d,n,f);t.attachments.push(n)}
  saveTopic(t,true);render();toast(`${files.length} file${files.length>1?'s':''} attached`)
}
function linkFromHit(x){
  const go={...x.go};const {tab,tsub,...rest}=go;
  const parts=['project',x.p.id,tab||'overview',...(tab==='testing'?[tsub||'batches']:[])].map(encodeURIComponent).join('/');
  const qs=new URLSearchParams({...Object.fromEntries(Object.entries(rest).filter(([,v])=>v!=null).map(([k,v])=>[k,String(v)])),...(x.hl?{hl:x.hl}:{})}).toString();
  const what=x.type==='project'?projName(x.p):`${x.id?x.id+' · ':''}${x.title}`;
  return {title:x.type==='project'?what:`${projName(x.p)} › ${what}`,url:'#'+parts+(qs?'?'+qs:'')};
}
/* drag inside a topic: tasks (t), groups (g), links (l) */
let nbDrag=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest?.('[data-nbdrag]');if(!el||!curTopic())return;
  nbDrag={type:el.dataset.nbdrag,g:+el.dataset.g,i:+el.dataset.i};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','nb')}catch{}e.stopPropagation()});
document.addEventListener('dragend',()=>{if(!nbDrag)return;nbDrag=null;document.querySelectorAll('.dragging,.nb-before,.nb-after').forEach(x=>x.classList.remove('dragging','nb-before','nb-after'))});
function nbTarget(e){
  if(!nbDrag)return null;
  if(nbDrag.type==='t'){const row=e.target.closest('.nb-task'),list=e.target.closest('[data-nbdrop]')||e.target.closest('.nb-group')?.querySelector('[data-nbdrop]');if(!list)return null;
    const g=+list.dataset.nbdrop;if(row){const r=row.getBoundingClientRect();return {el:row,g,i:+row.dataset.i+(e.clientY>r.top+r.height/2?1:0),after:e.clientY>r.top+r.height/2}}
    return {el:list.querySelector('.nb-add'),g,i:curTopic().groups[g].tasks.length,after:false}}
  if(nbDrag.type==='g'){const gr=e.target.closest('.nb-group');if(!gr)return null;const r=gr.getBoundingClientRect(),after=e.clientY>r.top+Math.min(r.height/2,30);return {el:gr,i:+gr.dataset.nbg+(after?1:0),after}}
  if(nbDrag.type==='l'){const row=e.target.closest('.nb-link');if(!row)return null;const r=row.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;return {el:row,i:+row.dataset.i+(after?1:0),after}}
}
document.addEventListener('dragover',e=>{const t=nbTarget(e);if(!t)return;e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.nb-before,.nb-after').forEach(x=>x.classList.remove('nb-before','nb-after'));t.el?.classList.add(t.after?'nb-after':'nb-before')});
document.addEventListener('drop',e=>{const t=nbTarget(e);if(!t)return;e.preventDefault();const tp=curTopic(),d=nbDrag;nbDrag=null;
  if(d.type==='t'){const src=tp.groups[d.g].tasks,[k]=src.splice(d.i,1);let i=t.i;if(t.g===d.g&&d.i<i)i--;tp.groups[t.g].tasks.splice(i,0,k)}
  else if(d.type==='g'){const [g]=tp.groups.splice(d.g,1);let i=t.i;if(d.g<i)i--;tp.groups.splice(i,0,g)}
  else{const [l]=tp.links.splice(d.i,1);let i=t.i;if(d.i<i)i--;tp.links.splice(i,0,l)}
  saveTopic(tp);render()});
const NBA={
  async 'nb-new'(){const inp=$('#nbNew'),name=inp?.value.trim();if(!name){inp?.focus();return}
    const dir=await nbDir();let slug=slugify(name),n=2;while(await dir.getFileHandle(slug+'.md').then(()=>true,()=>false))slug=slugify(name)+'-'+n++;
    const t={file:slug+'.md',slug,title:name,status:'Open',tags:[],created:nbDate(),updated:nbDate(),attachments:[],groups:[{name:'',tasks:[]}],links:[],notes:'',extra:[]};
    S.nb.topics.push(t);await saveTopic(t,true);S.view={page:'notebook',topic:slug};render();scrollTo(0,0);setTimeout(()=>$('.nb-add input')?.focus())},
  'nb-open'(d){S.nbEdit=null;S.view={page:'notebook',topic:d.slug};render();scrollTo(0,0)},
  'nb-back'(){S.nbEdit=null;S.view={page:'notebook'};render();scrollTo(0,0)},
  'nb-filter'(d){S.view.nbf=d.f;render()},
  'nb-tag'(d){S.view.nbtag=S.view.nbtag===d.t?'':d.t;render()},
  async 'nb-del'(d){const t=getTopic(d.slug);if(!t||!await confirmBox(`Delete the topic “${t.title}”? Its file notebook/${t.file} is removed. This can't be undone.`,'Delete'))return;
    await (await nbDir()).removeEntry(t.file).catch(e=>toast(e.message));S.nb.topics=S.nb.topics.filter(x=>x!==t);S.view={page:'notebook'};render()},
  'nb-toggle'(d){const t=curTopic(),k=t.groups[+d.g].tasks[+d.i];k.done=!k.done;saveTopic(t);render()},
  'nb-cnt'(d){const t=curTopic(),k=t.groups[+d.g].tasks[+d.i];k.cur=Math.max(0,(k.cur||0)+ +d.d);saveTopic(t);render()},
  'nb-cnt-set'(d){const t=curTopic(),k=t.groups[+d.g].tasks[+d.i];const v=prompt('Count and target, e.g. 3/10',`${k.cur||0}/${k.max}`);if(v==null)return;const m=v.match(/(\d+)\s*(?:\/\s*(\d+))?/);if(!m)return;k.cur=+m[1];if(m[2])k.max=Math.max(1,+m[2]);saveTopic(t);render()},
  'nb-kind'(d){const t=curTopic(),k=t.groups[+d.g].tasks[+d.i];
    if(k.max!=null){k.done=taskDone(k);delete k.max;delete k.cur}
    else{const v=prompt('Count up to how many?','10');if(v==null)return;const n=parseInt(v,10);if(!(n>0))return;k.max=n;k.cur=k.done?n:0;delete k.done}
    saveTopic(t);render()},
  'nb-task-del'(d){const t=curTopic();t.groups[+d.g].tasks.splice(+d.i,1);saveTopic(t);render()},
  'nb-group-add'(){const t=curTopic(),n=prompt('Name for the new group:');if(!n||!n.trim())return;if(t.groups.length===1&&!t.groups[0].name&&!t.groups[0].tasks.length)t.groups[0].name=n.trim();else{if(!t.groups[0].name)t.groups[0].name='Tasks';t.groups.push({name:n.trim(),tasks:[]})}saveTopic(t);render()},
  async 'nb-group-del'(d){const t=curTopic(),gi=+d.g,g=t.groups[gi];if(g.tasks.length&&!await confirmBox(`Delete the group “${g.name}”? Its ${g.tasks.length} task${g.tasks.length>1?'s':''} move to ${gi?'the group above':'the next group'}.`,'Delete group'))return;
    t.groups.splice(gi,1);if(!t.groups.length)t.groups.push({name:'',tasks:[]});else t.groups[Math.max(0,gi-1)].tasks[gi?'push':'unshift'](...g.tasks);
    if(t.groups.length===1&&t.groups[0].name==='Tasks')t.groups[0].name='';saveTopic(t);render()},
  'nb-link-new'(){S.nbEdit={link:'new'};render();setTimeout(()=>$('#nbLT')?.focus())},
  'nb-link-pick'(){S.gsPick=x=>{const l=linkFromHit(x);S.nbEdit={link:'new',...l};render();setTimeout(()=>$('#nbLT')?.focus())};openSearch()},
  'nb-link-edit'(d){S.nbEdit={link:+d.i};render();setTimeout(()=>$('#nbLT')?.focus())},
  'nb-link-cancel'(){S.nbEdit=null;render()},
  'nb-link-save'(d){const t=curTopic(),title=$('#nbLT').value.trim(),url=$('#nbLU').value.trim();if(!url){$('#nbLU').focus();return}
    const l={title:title||url,url};if(d.i==='new')t.links.push(l);else t.links[+d.i]=l;S.nbEdit=null;saveTopic(t);render()},
  'nb-link-del'(d){const t=curTopic();t.links.splice(+d.i,1);saveTopic(t);render()},
  'nb-prev'(d){S.nbPrev=d.v==='1';render()},
  'nb-att-del'(d){const t=curTopic();t.attachments=t.attachments.filter(n=>n!==d.n);saveTopic(t);render();toast('Removed from the topic (the file stays in notebook/attachments).')},
};
const NBCHG={
  'nb-status'(d,v){const t=getTopic(d.slug);t.status=v;saveTopic(t);render()},
  'nb-tags'(d,v){const t=getTopic(d.slug);t.tags=[...new Set(v.split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean))];saveTopic(t);render()},
  'nb-att'(d,v,el){const t=curTopic();if(t&&el.files.length)nbAddFiles(t,[...el.files]).catch(e=>toast(e.message))},
};
document.addEventListener('input',e=>{const el=e.target,k=el.dataset?.in;if(!k||!k.startsWith('nb-'))return;
  if(el.id==='nbSearch')return;const t=curTopic();if(!t)return;
  if(k==='nb-title'){t.title=el.value;document.title='Workbench - '+t.title;saveTopic(t)}
  else if(k==='nb-task'){const x=t.groups[+el.dataset.g]?.tasks[+el.dataset.i];if(x){x.text=el.value;saveTopic(t)}}
  else if(k==='nb-gname'){const g=t.groups[+el.dataset.g];if(g){g.name=el.value;saveTopic(t)}}
  else if(k==='nb-notes'){t.notes=el.value;saveTopic(t)}
});
document.addEventListener('input',e=>{if(e.target.id==='nbSearch'){S.nbq=e.target.value;render()}});
document.addEventListener('keydown',e=>{const el=e.target;
  if(el.id==='nbNew'&&e.key==='Enter'){e.preventDefault();NBA['nb-new']();return}
  if((el.id==='nbLT'||el.id==='nbLU')&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-act="nb-link-save"]')?.click();return}
  if((el.id==='nbLT'||el.id==='nbLU')&&e.key==='Escape'){e.preventDefault();e.stopPropagation();NBA['nb-link-cancel']();return}
  if(el.dataset?.in==='nb-add'&&e.key==='Enter'){e.preventDefault();const t=curTopic(),v=el.value.trim();if(!v)return;const m=v.match(/^#(\d+)\s+(.+)/);
    const gi=+el.dataset.g;t.groups[gi].tasks.push(m?{text:m[2],cur:0,max:+m[1]}:{text:v,done:false});saveTopic(t);render();setTimeout(()=>{const n=document.querySelector(`[data-in="nb-add"][data-g="${gi}"]`);n?.focus()});return}
  if(el.dataset?.in==='nb-task'&&e.key==='Enter'){e.preventDefault();el.blur()}
},true);

const nf=()=>new DOMException('Not found','NotFoundError');
class MemFile{constructor(n,d=''){this.kind='file';this.name=n;this.data=new Blob([d]);this.mtime=Date.now()}
  async getFile(){return new File([this.data],this.name,{lastModified:this.mtime})}
  async createWritable(){const s=this,parts=[];return {async write(d){parts.push(d)},async close(){s.data=new Blob(parts);s.mtime=Date.now()+Math.random()}}}
  async isSameEntry(o){return o===this}}
class MemDir{constructor(n){this.kind='directory';this.name=n;this.c=new Map()}
  async getDirectoryHandle(n,o={}){let e=this.c.get(n);if(!e){if(!o.create)throw nf();e=new MemDir(n);this.c.set(n,e)}if(e.kind!=='directory')throw new DOMException('x','TypeMismatchError');return e}
  async getFileHandle(n,o={}){let e=this.c.get(n);if(!e){if(!o.create)throw nf();e=new MemFile(n);this.c.set(n,e)}if(e.kind!=='file')throw new DOMException('x','TypeMismatchError');return e}
  async removeEntry(n){this.c.delete(n)}
  async *entries(){for(const kv of this.c)yield kv}
  async *values(){for(const v of this.c.values())yield v}
  async queryPermission(){return 'granted'}async requestPermission(){return 'granted'}
  async isSameEntry(o){return o===this}
  async resolve(t){if(t===this)return [];for(const [n,e] of this.c){if(e===t)return [n];if(e.kind==='directory'){const r=await e.resolve(t);if(r)return [n,...r]}}return null}}
function demoDir(name,files){const d=new MemDir(name),pm=new MemDir('proj_management');d.c.set('proj_management',pm);for(const [n,t] of Object.entries(files))pm.c.set(n,new MemFile(n,t));return d}

async function boot(){
  S.demo=new URLSearchParams(location.search).has('demo');
  S.set=loadSettings();applySettings();loadShoelace();
  S.mem=lsGet('wb-viewmem',{})||{};S.layout=lsGet('wb-layout',null);
  S.favs=lsGet('wb-favs',{})||{};S.paths=lsGet('wb-paths',{})||{};
  if(RUN_MODE!=='file'&&!S.demo){
    const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.append(l);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.info('No offline cache:',e.message));
  }
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;renderSettings()});
  if(S.demo)setupDemo();
  else{
    if(!window.showDirectoryPicker){render();return}
    await idb.open();S.ws=await idb.get('workspace')||null;S.records=(await idb.get('projects'))||[];
  }
  await loadAll();await loadNotebook().catch(e=>console.warn('notebook',e));S.since=S.demo?demoSince():sinceLast();S.view=routeFromHash()||S.view;S.booted=true;render();setInterval(poll,4000);autoRestoreProjects();
  if(S.since.length){const n=S.since.reduce((a,x)=>a+x.parts.reduce((b,y)=>b+y.n,0),0);toast(`${n} change${n>1?'s':''} across ${S.since.length} project${S.since.length>1?'s':''} since you were last here`)}
}
boot().catch(e=>{console.error(e);$('#app').innerHTML=`<div class="empty">Startup failed: ${h(e.message)}</div>`});
