/* =====================================================================
   THEME TOKENS — edit these to restyle the whole app.
   Dark is the default; light overrides follow.
   ===================================================================== */
:root{
  --font:"Source Sans 3","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* surfaces (warm forest charcoal) */
  --bg:#11140f;--glow:#1d2717;--panel:#191d16;--panel2:#21261d;--panel3:#2a3025;
  --line:#2e3428;--line-strong:#454d3c;
  --text:#ebe9de;--muted:#a09f8f;--faint:#717464;
  /* brand: moss / forest */
  --accent:#8db56b;--accent-strong:#a8cf85;--accent-soft:rgba(141,181,107,.14);--accent-ink:#11170c;--brand-deep:#2f4a25;
  /* result states */
  --pass:#58bb8c;--partial:#e2ad4c;--fail:#e46f61;--blocked:#8195aa;--skipped:#8e8b7e;--retest:#ab92e2;--untested:#2b3126;
  --feat:var(--accent);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 20px rgba(0,0,0,.22);
  --shadow-hover:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px rgba(0,0,0,.34);
  --r:14px;--r-sm:9px;
  --card-pad:16px;--test-pad:14px;--note-h:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{

/* ---------- features editor ---------- */
.area{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.area-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.color-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;font-size:13px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--panel3);border:1px solid var(--line-strong);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(14px);background:var(--accent-ink)}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--text)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
main.enter .card,main.enter .kpi,main.enter .panel,main.enter .area,main.enter .test{animation:rise .35s ease both}
main.enter .grid>*:nth-child(2){animation-delay:.04s}main.enter .grid>*:nth-child(3){animation-delay:.08s}main.enter .grid>*:nth-child(4){animation-delay:.12s}main.enter .grid>*:nth-child(n+5){animation-delay:.16s}
main.enter .bar{transform-origin:left;animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);background:var(--panel);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0);animation:toastGlow 1.6s ease-out}
#toast.clickable{pointer-events:auto;cursor:pointer}
#toast.clickable:hover{background:var(--panel2);border-color:var(--accent)}
#toast.big{font-size:14.5px;padding:13px 20px;font-weight:600}
#toast .toast-go{color:var(--accent-strong);margin-left:8px;white-space:nowrap}
@keyframes toastGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent),0 10px 30px rgba(0,0,0,.35)}35%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent),0 0 28px 4px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent,0 10px 30px rgba(0,0,0,.35)}}
#saving{font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.top nav{flex-wrap:nowrap}.top nav a{padding:6px 8px}.sec-head{flex-wrap:wrap}.card-rings{gap:12px}.ring{--sz:48px}.meta-grid{grid-template-columns:1fr}.top{gap:10px;padding:8px 12px}.brand span{display:none}.top .right .ws,.top .right [data-act="choose-ws"]{display:none}.feat-body{padding-left:0}.area-head .bar{width:70px}h1{font-size:22px}}

using Workbench, which re-reads this file automatically whenever it changes.
Full spec: PROJ_MANAGEMENT_SPEC.md (Workbench folder).

ADDING A NEW BATCH (one per version/build you hand over for testing)
- Add "## Batch <version>" ABOVE older batches (newest first). Never delete old batches.
- Optional lines directly under it: "Date: YYYY-MM-DD", then free text (batch-wide setup/notes).

-->`;

-->`;

- Questions or choices you need the human to make go in DECISIONS.md, not here.

-->`;

function parseFeatures(text){
  const m={name:'',status:'',summary:'',color:'',icon:'',intro:[],areas:[]};
  let area=null,feat=null,inHeader=true;
  const getArea=()=>{if(!area){area={name:'',desc:[],features:[]};m.areas.push(area)}return area};
  for(const raw of stripAgentNote(text).split(/\r?\n/)){
    const line=raw.replace(/\s+$/,'');let mm;
    if(/^#\s/.test(line)){if(!m.name)m.name=line.replace(/^#\s+/,'').replace(/^Features\s*[—–:-]\s*/i,'').trim();continue}
    if((mm=line.match(/^##\s+(.*)$/))){inHeader=false;feat=null;
      const nm=mm[1].replace(/^Area:\s*/i,'').trim();
      area=m.areas.find(a=>a.name===nm)||null;if(!area){area={name:nm,desc:[],features:[]};m.areas.push(area)}continue}
    if((mm=line.match(/^###\s+(.*)$/))){inHeader=false;let t=mm[1].trim(),stage='';
      const sm=t.match(/\s*\[([A-Za-z ]+)\]\s*$/);if(sm&&normStage(sm[1])){stage=normStage(sm[1]);t=t.slice(0,sm.index).trim()}
      const it=splitIdTitle(t);feat={id:it.id,title:it.title,stage:stage||'Ideated',desc:[],parts:[],source:''};getArea().features.push(feat);continue}
    if(inHeader){
      if((mm=line.match(/^(Project|Status|Summary|Color|Icon):\s*(.*)$/i))){const k=mm[1].toLowerCase();
        if(k==='project')m.name=mm[2].trim()||m.name;else if(k==='status')m.status=normStatus(mm[2]);else if(k==='color')m.color=/^app$/i.test(mm[2].trim())?'app':validColor(mm[2]);else if(k==='icon')m.icon=mm[2].trim();else m.summary=mm[2].trim()}
      else if(line.trim()&&!line.trim().startsWith('<!--'))m.intro.push(line);
      continue}
    if(feat){
      if((mm=line.match(/^\s*[-*]\s+\[([A-Za-z ]+)\]\s+(.*)$/))&&normStage(mm[1])){feat.parts.push({stage:normStage(mm[1]),text:mm[2].trim()});continue}
      if((mm=line.match(/^Source:\s*(.*)$/i))){feat.source=mm[1].trim();continue}
      feat.desc.push(line);continue}
    getArea().desc.push(line);
  }
  for(const a of m.areas){a.desc=trimLines(a.desc);for(const f of a.features)f.desc=trimLines(f.desc)}
  return m;
}
function serializeFeatures(m){

/* ---------------- TESTS.md ---------------- */
function parseTests(text){
  const m={name:'',intro:[],batches:[],dupes:[]};
  let b=null,t=null,mode=null;const seen=new Set();
  const newBatch=v=>{b={version:v,date:'',notes:[],tests:[]};m.batches.push(b)};
  for(const raw of stripAgentNote(text).split(/\r?\n/)){
    const line=raw.replace(/\s+$/,'');let mm;
    if(/^#\s/.test(line)){if(!m.name)m.name=line.replace(/^#\s+/,'').replace(/^Tests?\s*[—–:-]\s*/i,'').trim();continue}
    if((mm=line.match(/^##\s+(.*)$/))){t=null;mode=null;newBatch(mm[1].replace(/^Batch\s+/i,'').replace(/\((current|latest|new)\)/ig,'').trim()||'Unversioned');continue}
    if((mm=line.match(/^###\s+(.*)$/))){
      if(!b)newBatch('Unversioned');
      const it=splitIdTitle(mm[1]);
      t={id:it.id||('AUTO-'+hashStr(b.version+it.title)),title:it.title,area:'',feature:'',priority:'',setup:'',steps:[],expected:'',change:'',retests:[],desc:[],batch:b.version};
      if(seen.has(t.id))m.dupes.push(t.id);seen.add(t.id);
      b.tests.push(t);mode=null;continue}
    if(t){
      if((mm=line.match(/^\s*(Area|Feature|Priority|Setup|Steps|Expected|Change|Retests|Retest|Resolves|Log):\s*(.*)$/i))){
        const k=mm[1].toLowerCase(),v=mm[2].trim();
        if(k==='steps'){mode='steps';if(v)t.steps.push(v)}
        else if(k==='retests'||k==='retest'||k==='resolves'){t.retests.push(...v.split(/[,\s]+/).filter(Boolean));mode=null}
        else if(k==='priority'){t.priority=v.toLowerCase();mode=null}
        else if(k==='log'){t.desc.push('Log: '+v);mode=null}
        else{t[k]=v;mode=k}
        continue}
      if(mode==='steps'&&(mm=line.match(/^\s*(?:\d+[.)]|[-*])\s+(.*)$/))){t.steps.push(mm[1]);continue}
      if(!line.trim()){if(mode!=='steps')mode=null;continue}
      if(mode&&mode!=='steps'&&/^\s{2,}\S/.test(raw)){t[mode]+=' '+line.trim();continue}
      mode=null;t.desc.push(line);continue}
    if(b){if((mm=line.match(/^Date:\s*(.*)$/i)))b.date=mm[1].trim();else b.notes.push(line);continue}
    if(line.trim()&&!line.trim().startsWith('<!--'))m.intro.push(line);
  }
  for(const bb of m.batches){bb.notes=trimLines(bb.notes);for(const tt of bb.tests){tt.desc=trimLines(tt.desc);tt.hash=hashStr([tt.title,tt.setup,tt.steps.join('\n'),tt.expected].join('|'))}}
  return m;
}
const allTests=p=>p.tests.batches.flatMap(b=>b.tests);

const DEC_STATUS=['Open','Decided','Deferred','Dropped'];
const normDec=s=>DEC_STATUS.find(x=>x.toLowerCase()===String(s||'').trim().toLowerCase())||'';
function parseDecisions(text){
  const m={name:'',intro:[],items:[]};let d=null,mode=null;
  for(const raw of stripAgentNote(text).split(/\r?\n/)){
    const line=raw.replace(/\s+$/,'');let mm;
    if(/^#\s/.test(line)){if(!m.name)m.name=line.replace(/^#\s+/,'').replace(/^Decisions\s*[—–:-]\s*/i,'').trim();continue}
    if((mm=line.match(/^##\s+(.*)$/))){let t=mm[1].trim(),st='';
      const sm=t.match(/\s*\[([A-Za-z ]+)\]\s*$/);if(sm&&normDec(sm[1])){st=normDec(sm[1]);t=t.slice(0,sm.index).trim()}
      const it=splitIdTitle(t);d={id:it.id||('D-'+hashStr(it.title).slice(0,4).toUpperCase()),title:it.title,status:st||'Open',raised:'',area:'',feature:'',details:[],options:[],rec:'',decision:'',decided:'',notes:[]};m.items.push(d);mode=null;continue}
    if(!d){if(line.trim()&&!line.trim().startsWith('<!--'))m.intro.push(line);continue}
    if((mm=line.match(/^(Raised|Area|Feature|Recommendation|Decision|Decided|Updated):\s*(.*)$/i))){const k=mm[1].toLowerCase(),v=mm[2].trim();
      if(k==='recommendation')d.rec=v;else d[k]=v;mode=null;continue}
    if(/^Options:\s*$/i.test(line)){mode='opts';continue}
    if(/^Notes:\s*$/i.test(line)){mode='notes';continue}
    if(mode==='opts'&&(mm=line.match(/^\s*[-*]\s+(?:\*\*)?([A-Z]|\d{1,2})(?:\*\*)?\s*[:.)]\s*(.*)$/))){d.options.push({key:mm[1],text:mm[2].trim()});continue}
    if(mode==='opts'&&(mm=line.match(/^\s*[-*]\s+(.*)$/))){d.options.push({key:String.fromCharCode(65+d.options.length),text:mm[1].trim()});continue}
    if(mode==='notes'&&(mm=line.match(/^\s*>\s?(.*)$/))){d.notes.push(mm[1]);continue}
    if(mode&&!line.trim())continue;
    mode=null;d.details.push(line);
  }
  for(const x of m.items)x.details=trimLines(x.details);
  return m;
}
function serializeDecisions(m,name){
  let o=DECISIONS_NOTE+`\n# Decisions — ${m.name||name}\n`;
  if(m.intro.length)o+='\n'+m.intro.join('\n')+'\n';

    if(d.raised)o+=`Raised: ${d.raised}\n`;if(d.updated)o+=`Updated: ${d.updated}\n`;if(d.area)o+=`Area: ${d.area}\n`;if(d.feature)o+=`Feature: ${d.feature}\n`;
    if(d.details.length)o+='\n'+d.details.join('\n')+'\n';
    if(d.options.length){o+='\nOptions:\n'+d.options.map(x=>`- ${x.key}: ${x.text}`).join('\n')+'\n'}

    if(d.decision)o+=`\nDecision: ${d.decision}\n`;if(d.decided)o+=`Decided: ${d.decided}\n`;
    if(d.notes.some(x=>x.trim()))o+=`Notes:\n${d.notes.map(x=>'> '+x).join('\n')}\n`;

}

/* tiny, safe Markdown for decision details */
function md(lines){
  const inl=s=>h(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let o='',list=null,tbl=null;
  const flush=()=>{if(list){o+=`</${list}>`;list=null}if(tbl){o+='<div class="tbl-wrap"><table>'+tbl.map((r,i)=>`<tr>${r.map(c=>i?`<td>${inl(c)}</td>`:`<th>${inl(c)}</th>`).join('')}</tr>`).join('')+'</table></div>';tbl=null}};
  for(const l of lines){let m;
    if(/^\s*\|.*\|\s*$/.test(l)){if(list){o+=`</${list}>`;list=null}if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;(tbl=tbl||[]).push(l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue}
    if(tbl)flush();
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){if(list!=='ul'){flush();o+='<ul>';list='ul'}o+=`<li>${inl(m[1])}</li>`;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=='ol'){flush();o+='<ol>';list='ol'}o+=`<li>${inl(m[1])}</li>`;continue}
    flush();if(!l.trim())continue;
    if((m=l.match(/^#{3,6}\s+(.*)$/)))o+=`<h4>${inl(m[1])}</h4>`;
    else if((m=l.match(/^\s*>\s?(.*)$/)))o+=`<blockquote>${inl(m[1])}</blockquote>`;
    else o+=`<p>${inl(l)}</p>`;
  }
  flush();return o;
}

/* ---------------- FEEDBACK.md ---------------- */
function parseFeedbackData(text){
  const m=String(text||'').match(/<!-- PROJ-MGMT-DATA\r?\n([\s\S]*?)\r?\nPROJ-MGMT-DATA -->/);
  if(m){try{const d=JSON.parse(m[1]);d.results=d.results||{};d.issues=d.issues||[];return d}catch(e){console.warn('Bad feedback data',e)}}
  return {version:1,results:{},issues:[]};
}
function effState(p,t){
  const r=p.fb.results[t.id];if(!r||!r.state)return 'untested';
  if(r.hash&&t.hash&&r.hash!==t.hash&&r.state!=='retest'&&r.state!=='untested')return 'stale';
  return r.state;
}
function resolution(p,t){
  const fixers=allTests(p).filter(x=>x.retests.includes(t.id));if(!fixers.length)return null;
  const ok=fixers.find(x=>effState(p,x)==='pass');
  return ok?{status:'resolved',by:ok}:{status:'pending',by:fixers[0]};
}
function batchStats(p,b){
  const c={total:0,untested:0,pass:0,partial:0,fail:0,blocked:0,skipped:0,retest:0};
  for(const t of b.tests){c.total++;let s=effState(p,t);if(s==='stale')s='retest';c[s]++}
  c.done=c.total-c.untested-c.retest;return c;
}
function sumStats(p){const c={total:0,untested:0,pass:0,partial:0,fail:0,blocked:0,skipped:0,retest:0,done:0};for(const b of p.tests.batches){const s=batchStats(p,b);for(const k in c)c[k]+=s[k]}return c}
const SEV_RANK={Critical:0,Major:1,Minor:2,Cosmetic:3};
function openIssues(p){
  const out=[];for(const t of allTests(p)){const s=effState(p,t);if(s!=='fail'&&s!=='partial')continue;const res=resolution(p,t);if(res&&res.status==='resolved')continue;out.push({t,r:p.fb.results[t.id],res})}
  return out.sort((a,b)=>(SEV_RANK[a.r.severity]??9)-(SEV_RANK[b.r.severity]??9));
}
const GI_KINDS=['Change','Bug','Question','Feature request','Investigate','Other'];
const GI_STATUS={open:'Open',progress:'In progress',answered:'Answered',resolved:'Done',wontfix:'Won’t do'};
const issueRes=(p,i)=>resolution(p,{id:i.id});
const giOpen=(p,i)=>(i.status==='open'||i.status==='progress')&&issueRes(p,i)?.status!=='resolved';
const giAnswered=p=>(p.fb.issues||[]).filter(i=>i.status==='answered');
const openGeneral=p=>(p.fb.issues||[]).filter(i=>giOpen(p,i)).sort((a,b)=>(SEV_RANK[a.severity]??9)-(SEV_RANK[b.severity]??9));
const openCount=p=>openIssues(p).length+openGeneral(p).length;
function nextGiId(p){let n=0;for(const i of p.fb.issues||[]){const m=i.id.match(/^GI-(\d+)$/);if(m)n=Math.max(n,+m[1])}return 'GI-'+String(n+1).padStart(3,'0')}
function quote(s){return String(s||'').split(/\r?\n/).map(l=>'> '+l).join('\n')}
function attLinks(r){return (r.attachments||[]).map(n=>`[${n}](attachments/${encodeURI(n)})`).join(', ')}
function serializeFeedback(p){
  const R=p.fb.results;
  let o=FEEDBACK_NOTE+`\n# Feedback — ${projName(p)}\n\nUpdated: ${nowStamp()}\n\n## Summary\n\n| Batch | Tests | Pass | Partial | Fail | Blocked | Skipped | Needs retest | Untested |\n|---|---|---|---|---|---|---|---|---|\n`;
  for(const b of p.tests.batches){const c=batchStats(p,b);o+=`| ${b.version} | ${c.total} | ${c.pass} | ${c.partial} | ${c.fail} | ${c.blocked} | ${c.skipped} | ${c.retest} | ${c.untested} |\n`}
  const oi=openIssues(p);
  o+=`\n## Open issues (${oi.length})\n`;if(!oi.length)o+='\nNone.\n';
  for(const {t,r,res} of oi){
    o+=`\n### ${t.id} · ${t.title} — ${STATE_LABEL[r.state]}${r.severity?' · '+r.severity:''}\n`;
    o+=`Batch: ${t.batch} · Tested: ${r.updated||'?'}${t.feature?' · Feature: '+t.feature:''}${t.area?' · Area: '+t.area:''}\n`;
    if(res)o+=`Fix pending: ${res.by.id} (batch ${res.by.batch}) not yet passed\n`;
    o+=(r.notes?.trim()?quote(r.notes):'> (no notes)')+'\n';
    if(r.attachments?.length)o+=`Attachments: ${attLinks(r)}\n`;
  }
  const gis=p.fb.issues||[],gOpen=gis.filter(i=>giOpen(p,i)),gClosed=gis.filter(i=>!giOpen(p,i));
  o+=`\n## Changes (${gOpen.length} open) — full entries in CHANGES.md\n`;if(!gis.length)o+='\nNone.\n';
  for(const i of [...gOpen].sort((a,b)=>(SEV_RANK[a.severity]??9)-(SEV_RANK[b.severity]??9))){
    const res=issueRes(p,i);
    o+=`\n### ${i.id} · ${i.title} — ${i.kind||'Bug'}${i.severity?' · '+i.severity:''} · OPEN\n`;
    o+=`Raised: ${i.created||'?'}${i.updated&&i.updated!==i.created?' · Updated: '+i.updated:''}\n`;
    if(res)o+=`Fix pending: ${res.by.id} (batch ${res.by.batch}) not yet passed\n`;
    o+=(i.notes?.trim()?quote(i.notes):'> (no details)')+'\n';
    if(i.attachments?.length)o+=`Attachments: ${attLinks(i)}\n`;
  }
  if(gClosed.length){o+=`\nClosed:\n\n`;for(const i of gClosed){const res=issueRes(p,i);o+=`- ${i.id} · ${i.title} — ${res?.status==='resolved'?'RESOLVED by '+res.by.id:GI_STATUS[i.status]||i.status}\n`}}
  const rt=allTests(p).filter(t=>['retest','stale'].includes(effState(p,t)));
  o+=`\n## Needs retest (${rt.length})\n`;if(!rt.length)o+='\nNone.\n';else o+='\n';
  for(const t of rt){const r=R[t.id];o+=`- ${t.id} · ${t.title} (batch ${t.batch}) — ${effState(p,t)==='stale'?'test text changed after it was tested (was '+STATE_LABEL[r.state]+')':'flagged by tester'}${r.notes?.trim()?' — '+r.notes.trim().replace(/\s+/g,' '):''}\n`}
  const bs=allTests(p).filter(t=>['blocked','skipped'].includes(effState(p,t)));
  o+=`\n## Blocked / skipped (${bs.length})\n`;if(!bs.length)o+='\nNone.\n';else o+='\n';
  for(const t of bs){const r=R[t.id];o+=`- ${t.id} · ${t.title} (batch ${t.batch}) — ${STATE_LABEL[r.state]}${r.notes?.trim()?' — '+r.notes.trim().replace(/\s+/g,' '):''}\n`}
  const reqs=allFeatures(p.features).filter(f=>/user/i.test(f.source));
  o+=`\n## Feature requests (${reqs.length})\n`;if(!reqs.length)o+='\nNone.\n';else o+='\nDetails are in FEATURES.md.\n\n';
  for(const f of reqs)o+=`- ${f.id} · ${f.title} [${f.stage}]\n`;
  o+=`\n## Results by batch\n`;
  for(const b of p.tests.batches){
    const done=b.tests.filter(t=>effState(p,t)!=='untested');
    o+=`\n### Batch ${b.version}\n\n`;if(!done.length){o+='No results yet.\n';continue}
    for(const t of done){const r=R[t.id],s=effState(p,t),res=(s==='fail'||s==='partial')?resolution(p,t):null;
      o+=`- **${STATE_LABEL[s]}**${r.severity&&(s==='fail'||s==='partial')?' ('+r.severity+')':''} ${t.id} · ${t.title} — ${r.updated||''}${res?(res.status==='resolved'?' — RESOLVED by '+res.by.id:' — fix pending: '+res.by.id):''}\n`;
      if(r.notes?.trim())o+=r.notes.trim().split(/\r?\n/).map(l=>'  > '+l).join('\n')+'\n';
      if(r.attachments?.length)o+=`  Attachments: ${attLinks(r)}\n`;
    }
  }
  const known=new Set(allTests(p).map(t=>t.id));const orphans=Object.keys(R).filter(k=>!known.has(k)&&R[k].state);
  if(orphans.length){o+=`\n## Results for tests no longer in TESTS.md\n\n`;for(const k of orphans)o+=`- ${k} · ${R[k].title||''} — ${STATE_LABEL[R[k].state]||R[k].state}\n`}
  const json=JSON.stringify({version:1,results:R,issues:[]},null,1).replace(/-->/g,'--\\u003e');
  return o+`\n<!-- PROJ-MGMT-DATA\n${json}\nPROJ-MGMT-DATA -->\n`;
}

/* ---------------- file helpers ---------------- */
async function readFile(dir,name){
  try{const fh=await dir.getFileHandle(name);const f=await fh.getFile();return {text:await f.text(),mtime:f.lastModified}}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e}
}
async function writeFile(dir,name,data){
  const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(data);await w.close();
  return (await fh.getFile()).lastModified;
}
async function copyDir(src,dst){
  for await(const [n,e] of src.entries()){
    if(e.kind==='file')await writeFile(dst,n,await e.getFile());
    else await copyDir(e,await dst.getDirectoryHandle(n,{create:true}));
  }
}
async function perm(hd){if(!hd)return 'missing';if(!hd.queryPermission)return 'granted';try{return await hd.queryPermission({mode:'readwrite'})}catch{return 'prompt'}}

function idPrefix(name){
  const w=String(name||'').replace(/([a-z])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9]+/).filter(Boolean);
  let p=w.length>1?w.map(x=>x[0]).join(''):(w[0]||'T').slice(0,3);
  p=p.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  return /^[A-Z]/.test(p)?p:'T'+p;
}
/* Reads checklist-style test lists: "## <version>" headings, "- [ ] item" / "- [x] item", optional "Feedback: ..." sub-lines. */
function parseChecklist(text){
  const batches=[];let b=null,last=null;
  for(const raw of String(text||'').split(/\r?\n/)){
    let mm;
    if((mm=raw.match(/^#{2,4}\s+(.*)$/))){b={version:mm[1].replace(/\((current|latest|new)\)/ig,'').replace(/^Batch\s+/i,'').trim()||'Imported',notes:[],items:[]};batches.push(b);last=null;continue}
    if((mm=raw.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){if(!b){b={version:'Imported',notes:[],items:[]};batches.push(b)}last={done:mm[1]!==' ',text:mm[2].trim(),fb:''};b.items.push(last);continue}
    if(last&&(mm=raw.match(/^\s*(?:[-*]\s+)?Feedback:\s*(.*)$/i))){last.fb=mm[1].trim();continue}
    if(last&&/^\s{2,}\S/.test(raw)){last.text+=' '+raw.trim();continue}
    if(b&&!b.items.length&&raw.trim())b.notes.push(raw.trim());
  }
  return batches.filter(x=>x.items.length);
}
function checklistToTests(name,batches,prefix){
  const idmap=new Map();let n=0;
  for(const b of [...batches].reverse())for(const it of b.items)idmap.set(it,`${prefix}-${String(++n).padStart(3,'0')}`);
  let o=TESTS_NOTE+`\n# Tests — ${name}\n`;
  for(const b of batches){
    o+=`\n## Batch ${b.version}\n`;if(b.notes.length)o+=b.notes.join('\n')+'\n';
    for(const it of b.items){
      const parts=it.text.split(/\s+[-–—]\s+/);let title=parts[0].replace(/\s+/g,' '),exp=parts.slice(1).join(' - ');
      if(title.length>90){exp=it.text;title=title.slice(0,80).replace(/\s+\S*$/,'')+'…'}
      o+=`\n### ${idmap.get(it)} · ${title}\n${exp?`Expected: ${exp}\n`:''}`;
    }
  }
  return {text:o,idmap};
}
async function scanLegacy(p){
  const found=[];
  const scan=async(dir,prefix,depth)=>{for await(const [n,e] of dir.entries()){
    if(e.kind==='directory'){if(depth<1&&/^(docs?|documentation|notes|planning|plans)$/i.test(n))await scan(e,prefix+n+'/',depth+1);continue}
    if(!/\.(md|markdown|txt)$/i.test(n))continue;
    const kind=/test|qa|checklist|verif/i.test(n)?'testing':/plan|roadmap|todo|feature|design|spec|backlog|idea/i.test(n)?'planning':/readme|changelog|claude|agents?\.md|notes/i.test(n)?'info':null;
    if(kind)found.push({path:prefix+n,kind,handle:e});
  }};
  if(p.handle.name!=='proj_management')await scan(p.handle,'',0);
  return found;
}
function setupDoc(p,docs,imported){
  const list=docs.length?docs.map(d=>`- ${d.path} (${d.kind})`).join('\n'):'- (none found)';
  return `<!-- PROJ-MGMT:SETUP v1
AGENT INSTRUCTIONS - One-time setup. Do the steps below, then DELETE this file.
Workbench shows "waiting for agent setup" on this project until the file is gone.
-->
# Agent setup — ${projName(p)}

This project was just added to Workbench. \`proj_management/\` now holds:
- TESTS.md: you write test batches here (format in its top comment)
- FEATURES.md: features by area and stage, shared with the human
- FEEDBACK.md: the human's results and notes (read-only for you)
- DECISIONS.md: questions you need the human to decide, with your research and options
- IDEAS.md: the human's not-yet-committed ideas; act only on [Ready] ones

## Never overwrite these files
These files already exist and may hold the human's work, even if you haven't seen them before.
- Before creating any proj_management file, check whether it exists. If it does, READ it and EDIT it (add to it); never replace it with a fresh file.
- Create a file only when it is truly missing, and start it with the header comment from PROJ_MANAGEMENT_SPEC.md.
- Edit in place: change only the lines you mean to change and keep everything else (other ideas, decisions, features, the human's notes).
- Workbench saves a copy in proj_management/history/ when a file loses entries, but don't rely on that.

## Do once
1. Read the existing docs listed below.
2. Move planned, in-progress and finished features into FEATURES.md (areas, IDs, stages: Ideated, Designed, Testing, Iterating, Completed). Keep the human's Status line.
3. ${imported?`Tests from ${imported.path} were imported into TESTS.md (${imported.count} tests; ticked items became PASS results). Tidy any awkward titles, add Area:/Feature: links where obvious, and write future batches to TESTS.md instead of ${imported.path}.`:'If any doc below holds a test checklist, convert its open items into a "## Batch <version>" in TESTS.md.'}
4. Update your own project notes (CLAUDE.md, build plan, etc.) so future sessions know testing and features are tracked in proj_management/.
5. Delete this file.

## Existing docs found
${list}
`;
}
async function onboardProject(p,{fresh}){
  const docs=await scanLegacy(p);let imported=null;
  if(!allTests(p).length){
    for(const d of docs.filter(x=>x.kind==='testing')){
      const f=await d.handle.getFile();if(f.size>3e6)continue;
      const batches=parseChecklist(await f.text()),count=batches.reduce((a,b)=>a+b.items.length,0);
      if(!count)continue;
      if(!await confirmBox(`Found ${d.path} with ${count} test items in ${batches.length} batch${batches.length>1?'es':''}. Import them into proj_management/TESTS.md? Ticked items become PASS and any “Feedback:” lines become notes. The original file is left untouched.`,'Import'))continue;
      const {text,idmap}=checklistToTests(projName(p),batches,idPrefix(projName(p)));
      p.mt.tests=await writeFile(p.pm,'TESTS.md',text);p.tests=parseTests(text);
      for(const b of batches)for(const it of b.items){
        if(!it.done&&!it.fb)continue;const t=allTests(p).find(x=>x.id===idmap.get(it));if(!t)continue;
        const r=touch(p,t);if(it.done)r.state='pass';if(it.fb)r.notes=it.fb;r.updated='imported';
      }
      await saveFeedbackNow(p);imported={path:d.path,count};break;
    }
  }
  if(fresh||imported){await writeFile(p.pm,'AGENT_SETUP.md',setupDoc(p,docs,imported));p.setupPending=true}
  return imported;
}

/* ---------------- CHANGES.md: the human's requests (changes, bugs, questions, idea/research requests) ---------------- */
const CH_KINDS=GI_KINDS;
const CH_KIND_ICON={Change:'edit',Bug:'alert',Question:'chat','Feature request':'bulb',Investigate:'search',Other:'dot'};
const CH_FROM={open:'open','in progress':'progress',progress:'progress',answered:'answered',done:'resolved',resolved:'resolved',"won't do":'wontfix','won’t do':'wontfix',"won't fix":'wontfix','won’t fix':'wontfix',wontfix:'wontfix'};
const CH_TO={open:'Open',progress:'In progress',answered:'Answered',resolved:'Done',wontfix:"Won't do"};
const KIND_OLD={suggestion:'Change','idea request':'Feature request',research:'Investigate'};
const normKind=k=>KIND_OLD[String(k||'').toLowerCase()]||CH_KINDS.find(x=>x.toLowerCase()===String(k||'').toLowerCase())||'Change';
const CHANGES_NOTE=`<!-- PROJ-MGMT:CHANGES v1
NEVER REPLACE THIS FILE: read it and edit it in place. Keep every entry you aren't changing.
The human's inbox for this project's agent (Workbench's Inbox tab): requests, bugs, questions.
- One "## <ID> · <title> [Status]" per entry. IDs (GI-001…) are unique and never reused.
  Status: Open | In progress | Answered | Done | Won't do
- Lines under the heading: Kind (Change | Bug | Question | Feature request | Investigate | Other),
  Severity (bugs only: Cosmetic | Minor | Major | Critical), Added, Updated, Resolved, From, Attachments.
  "From: I-006" means the human sent idea I-006 here; treat the entry like any other.
- Then the human's notes. Never edit them.
HOW TO RESPOND (agent)
- Change / Bug: set "In progress" while you work. When shipped, add a test with
  "Retests: <ID>" in TESTS.md so the human can confirm; Workbench marks it Done when that test passes.
- Question / Investigate: answer in a "Reply:" block at the END of the entry
  (each line starting with "> "), then set the status to Answered.
- Feature request: design it as a feature in FEATURES.md (or raise a decision if a choice is
  needed first), reply with the IDs, and set Answered. Build it only when the human asks.
- Follow-ups: when the human follows up, a "Follow-up: <Kind> · <date>" block appears after the
  earlier messages. Answer the latest one with a new "Reply:" block right under it.
- Need the human to choose something? Raise it in DECISIONS.md and mention the D-ID in the reply.
- You may add entries yourself only when the human asks.
- Log every entry you read or act on in AGENT_LOG.md (seen / acted).
-->`;
function parseChanges(text){
  const items=[];let it=null,cur=null,phase='',inNote=false;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    if(inNote){if(line.includes('-->'))inNote=false;continue}
    if(!it&&/^\s*<!--/.test(line)){if(!line.includes('-->'))inNote=true;continue}
    let m=line.match(/^##\s+([A-Z]+-\d+)\s*[·\-–—:]\s*(.*?)\s*(?:\[([^\]]+)\])?\s*$/);
    if(m){it={id:m[1],title:m[2],status:CH_FROM[String(m[3]||'open').toLowerCase()]||'open',kind:'Change',severity:'',created:'',updated:'',attachments:[],notes:'',reply:'',by:'',follow:[]};items.push(it);phase='fields';it._n=[];it._r=[];cur=it;continue}
    if(!it)continue;
    if(phase==='fields'&&(m=line.match(/^(Kind|Severity|Added|Updated|Resolved|From|Attachments|By):\s*(.*)$/i))){const k=m[1].toLowerCase(),v=m[2].trim();if(k==='resolved'||k==='from'){it[k]=v;continue}
      if(k==='kind')it.kind=normKind(v);else if(k==='severity')it.severity=SEVERITIES.find(s=>s.toLowerCase()===v.toLowerCase())||'';
      else if(k==='added')it.created=v;else if(k==='updated')it.updated=v;else if(k==='by')it.by=v;
      else it.attachments=[...v.matchAll(/\[([^\]]+)\]\(/g)].map(x=>x[1]);continue}
    if((m=line.match(/^Follow-up:\s*(.*?)\s*(?:[·\-–—]\s*(.*))?$/i))){cur={kind:normKind(m[1]),date:(m[2]||'').trim(),_n:[],_r:[]};it.follow.push(cur);phase='notes';continue}
    if(/^Reply:\s*$/i.test(line)){phase='reply';continue}
    if(phase==='reply'){if(/^>/.test(line)||!line.trim())cur._r.push(line.replace(/^>\s?/,''));else{phase='notes';cur._n.push(line)}continue}
    if(phase==='fields'&&!line.trim())continue;
    phase=phase==='fields'?'notes':phase;cur._n.push(line);
  }
  const fin=o=>{const n=o._n.join('\n').replace(/^\n+|\n+$/g,''),r=o._r.join('\n').replace(/^\n+|\n+$/g,'');delete o._n;delete o._r;return [n,r]};
  for(const i of items){[i.notes,i.reply]=fin(i);i.follow=i.follow.map(f=>{const [t,r]=fin(f);return {kind:f.kind,date:f.date,text:t,reply:r}});if(i.kind!=='Bug')i.severity=i.severity||''}
  return items;
}
function serializeChanges(name,items){
  let o=`${CHANGES_NOTE}\n# Changes — ${name}\n`;
  for(const i of items){
    o+=`\n## ${i.id} · ${String(i.title).replace(/\n/g,' ')} [${CH_TO[i.status]||'Open'}]\nKind: ${normKind(i.kind)}\n`;
    if(i.severity&&i.kind==='Bug')o+=`Severity: ${i.severity}\n`;
    if(i.created)o+=`Added: ${i.created}\n`;if(i.updated)o+=`Updated: ${i.updated}\n`;if(i.resolved)o+=`Resolved: ${i.resolved}\n`;if(i.from)o+=`From: ${i.from}\n`;if(i.by)o+=`By: ${i.by}\n`;
    if(i.attachments?.length)o+=`Attachments: ${attLinks(i)}\n`;
    if(i.notes?.trim())o+=`\n${i.notes.trim()}\n`;
    const q=t=>t.trim().split('\n').map(l=>l?'> '+l:'>').join('\n');
    if(i.reply?.trim())o+=`\nReply:\n${q(i.reply)}\n`;
    for(const f of i.follow||[]){o+=`\nFollow-up: ${normKind(f.kind)} · ${f.date||''}\n`;if(f.text?.trim())o+=`${f.text.trim()}\n`;if(f.reply?.trim())o+=`\nReply:\n${q(f.reply)}\n`}
  }
  return o;
}
const CH_FIELDS=['title','status','kind','severity','created','updated','resolved','from','attachments','notes','reply','by','follow'];
const chClone=a=>JSON.parse(JSON.stringify(a||[]));
function chMerge(base,ours,theirs,deleted){
  const B=new Map((base||[]).map(i=>[i.id,i])),T=new Map((theirs||[]).map(i=>[i.id,i])),out=[];
  const same=(a,b)=>JSON.stringify(a??'')===JSON.stringify(b??'');
  for(const o of ours){const t=T.get(o.id),b=B.get(o.id);if(!t||!b){out.push(o);continue}
    const r={...o};for(const f of CH_FIELDS)r[f]=same(o[f],b[f])?t[f]:o[f];out.push(r)}
  const have=new Set(ours.map(i=>i.id));
  for(const t of theirs||[])if(!have.has(t.id)&&!(deleted&&deleted.has(t.id))&&!B.has(t.id))out.push(t);
  return out;
}
async function loadChanges(p){
  const f=await readFile(p.pm,'CHANGES.md');const legacy=(p.fb.issues||[]).map(i=>({...i,kind:normKind(i.kind),status:CH_FROM[i.status]||i.status||'open'}));
  if(f){const items=parseChanges(f.text);const have=new Set(items.map(i=>i.id));const extra=legacy.filter(i=>!have.has(i.id));
    p.fb.issues=[...items,...extra];p.ch={base:chClone(items),mtime:f.mtime};if(extra.length)await saveChanges(p)}
  else{p.fb.issues=legacy;p.ch={base:[],mtime:0};await saveChanges(p)}
}
async function saveChanges(p){
  const cur=await readFile(p.pm,'CHANGES.md');
  if(cur&&cur.mtime!==p.ch.mtime){p.fb.issues=chMerge(p.ch.base,p.fb.issues||[],parseChanges(cur.text),p.fbDeleted)}
  const txt=serializeChanges(projName(p),p.fb.issues||[]);
  if(cur&&cur.text===txt){p.ch={base:chClone(p.fb.issues),mtime:cur.mtime};return}
  p.ch={base:chClone(p.fb.issues),mtime:await writeFile(p.pm,'CHANGES.md',txt)};
}
async function pollChanges(p){
  let f;try{f=await (await p.pm.getFileHandle('CHANGES.md')).getFile()}catch{return null}
  if(f.lastModified===p.ch?.mtime||p._fbPend)return null;
  const theirs=parseChanges(await f.text()),base=p.ch.base,B=new Map(base.map(i=>[i.id,i]));
  const replied=theirs.filter(t=>t.reply&&t.reply!==(B.get(t.id)?.reply||'')),added=theirs.filter(t=>!B.has(t.id));
  p.fb.issues=chMerge(base,p.fb.issues||[],theirs,p.fbDeleted);p.ch={base:chClone(theirs),mtime:f.lastModified};
  const msg=[replied.length?`reply on ${replied.map(x=>x.id).join(', ')}`:'',added.length?`${added.length} new change${added.length>1?'s':''}`:''].filter(Boolean).join(', ');
  return msg?`${projName(p)}: ${msg}`:`${projName(p)}: CHANGES.md updated`;
}

/* ---------------- AGENT_LOG.md: what the agent has seen or acted on (D-016) ---------------- */
const AGENTLOG_NOTE=`<!-- PROJ-MGMT:AGENT_LOG v1
NEVER REPLACE THIS FILE: append to it. The agent writes it; Workbench reads it.
After each pass over this project, add a section at the END:
  ## YYYY-MM-DD HH:MM:SS
  - <ID>: acted - <what you did>      (you fixed / replied / promoted / acted on it)
  - <ID>: seen                        (you read it; nothing to do, e.g. a pass with notes)
To have the human test something again, add a NEW test in TESTS.md with "Retests: <old ID>";
never try to clear a result through this log.
IDs: tests (WB-012), changes (GI-003), decisions (D-004), ideas (I-007).
Workbench shows a "seen"/"acted" tick on each item and leaves it out of the next review
prompt until the human changes it again.
-->`;
function agentlogTemplate(name){return `${AGENTLOG_NOTE}\n# Agent log — ${name}\n`}
function parseAgentLog(text){const m=new Map();let date='';
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){let x;
    if((x=line.match(/^##\s+(\d{4}-\d\d-\d\d(?:[ T]\d\d:\d\d(?::\d\d)?)?)/))){date=x[1].replace('T',' ');continue}
    if((x=line.match(/^\s*[-*]\s+([A-Z]+-\d+)\s*:\s*(acted|seen|ready to retest|retest)\b\s*(?:[-–—:]\s*(.*))?$/i))&&date){const st=x[2].toLowerCase().startsWith('ready')||x[2].toLowerCase()==='retest'?'retest':x[2].toLowerCase();
      const prev=m.get(x[1]);if(!prev||prev.date<=date)m.set(x[1],{status:st,date,note:(x[3]||'').trim()})}}
  return m}
async function loadAgentLog(p){let f=await readFile(p.pm,'AGENT_LOG.md');if(!f){await writeFile(p.pm,'AGENT_LOG.md',agentlogTemplate(projName(p)));f=await readFile(p.pm,'AGENT_LOG.md')}
  p.alog=parseAgentLog(f?.text);p.mt.alog=f?.mtime;applyRetestResets(p)}

    feats:Object.fromEntries(allFeatures(p.features).map(f=>[f.id,Math.round(featPct(f))])),

function sinceLast(){

    if(!p.loaded)continue;const now=snapOf(p),was=seen[p.id];seen[p.id]=now;
    if(!was)continue; // first time we see this project: nothing to compare yet
    const has=(arr,x)=>arr.includes(x);
    const nb=now.batches.filter(v=>!has(was.batches,v)),nt=now.tests.filter(x=>!has(was.tests,x));
    const nf=Object.keys(now.feats).filter(x=>!(x in was.feats)),mf=Object.keys(now.feats).filter(x=>x in was.feats&&now.feats[x]>was.feats[x]);
    const nd=now.decs.filter(x=>!has(was.decs,x)),ni=now.ideas.filter(x=>!has(was.ideas,x));
    const ri=Object.keys(now.issues).filter(x=>now.issues[x]==='resolved'&&(was.issues||{})[x]!=='resolved');
    const parts=[];
    if(nt.length)parts.push({n:nt.length,t:`new test${nt.length>1?'s':''}${nb.length?` in ${nb.length>1?nb.length+' new batches':'batch '+nb[0]}`:''}`,go:{tab:'testing',tsub:'batches',batch:nb.length>1?'*':nb[0]||allTests(p).find(t=>t.id===nt[0])?.batch,filter:'todo'},ids:nt.map(x=>'t-'+x),what:'new tests'});

    if(ni.length)parts.push({n:ni.length,t:`new idea${ni.length>1?'s':''}`,go:{tab:'ideas',ifilter:'all'},ids:ni.map(x=>'i-'+x),what:'new ideas'});

/* ---------------- auto-growing text boxes ----------------
   auto : grows with the text up to 8 lines, then scrolls
   grow : user dragged it taller -> keeps growing to fit, no limit
   fixed: user dragged it shorter -> stays exactly that size
   Remembered per box (data-k) while the app is open. */
S.ta={};
function taFit(el){
  const k=el.dataset.k;if(!k)return;const st=S.ta[k]||(S.ta[k]={mode:'auto'});
  if(st.mode==='fixed'){el.style.height=st.h+'px';st.last=el.offsetHeight;return}
  const cs=getComputedStyle(el),lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5;
  const frame=el.offsetHeight-el.clientHeight,pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const max=Math.ceil(lh*8+pad+frame),top=el.scrollTop;
  el.style.height='auto';const need=el.scrollHeight+frame;
  if(st.mode==='grow'){if(need>max)st.over=true;else if(st.over){st.mode='auto';st.over=false}}
  const hgt=st.mode==='grow'?Math.max(st.h,need):Math.min(need,max);
  el.style.height=hgt+'px';el.scrollTop=top;st.last=el.offsetHeight;
}
let taDrag=null;
document.addEventListener('pointerdown',e=>{const el=e.target;if(el.tagName==='TEXTAREA'&&el.dataset.k)taDrag={el,h0:el.offsetHeight}},true);
document.addEventListener('pointerup',()=>{
  if(!taDrag)return;const {el,h0}=taDrag;taDrag=null;if(!el.isConnected||!el.offsetHeight)return;
  const h1=el.offsetHeight,st=S.ta[el.dataset.k]||(S.ta[el.dataset.k]={mode:'auto'});
  if(Math.abs(h1-h0)<2)return;                    // a click, not a resize
  if(h1>h0){st.mode='grow';st.h=h1;taFit(el)}     // made bigger: keep fitting the text
  else{st.mode='fixed';st.h=h1}                   // made smaller: stay put
},true);

function loadThumbs(){
  document.querySelectorAll('img[data-att]').forEach(async img=>{
    const [pid,...rest]=img.dataset.att.split('|');const name=rest.join('|');const p=getP(pid);if(!p)return;
    try{const u=await attUrl(p,name);img.src=u;const a=img.closest('a');if(a)a.href=u}catch{img.alt='missing: '+name}
  });
}
const findGi=(p,id)=>(p.fb.issues||[]).find(i=>i.id===id);
function attTarget(p,id){const gi=findGi(p,id);if(gi){gi.updated=nowStampS();return gi}const t=allTests(p).find(x=>x.id===id);return t?touch(p,t):null}
async function addIdeaAttachments(p,id,files){
  const dir=await p.pm.getDirectoryHandle('attachments',{create:true}),names=[];
  for(const f of files){const ext=(f.name&&f.name.includes('.')?f.name.split('.').pop():(f.type.split('/')[1]||'png')).toLowerCase().replace(/[^a-z0-9]/g,'');
    const base=(f.name&&f.name!=='image.png'?f.name.replace(/\.[^.]+$/,'').replace(/[^\w-]+/g,'_').slice(0,40):'screenshot');
    const name=`${id}_${base}_${Date.now().toString(36)}${names.length}.${ext||'png'}`;await writeFile(dir,name,f);names.push(name)}
  await editIdeas(p,m=>{const x=m.items.find(y=>y.id===id);if(x)x.attachments=[...(x.attachments||[]),...names]});
  toast(`Attached ${names.length} file${names.length>1?'s':''} to ${id}`);
}
async function addAttachments(p,t,files){
  const dir=await p.pm.getDirectoryHandle('attachments',{create:true});const r=attTarget(p,t.id);if(!r)return;r.attachments=r.attachments||[];
  for(const f of files){
    const ext=(f.name&&f.name.includes('.')?f.name.split('.').pop():(f.type.split('/')[1]||'bin')).toLowerCase().replace(/[^a-z0-9]/g,'');
    const base=(f.name&&f.name!=='image.png'?f.name.replace(/\.[^.]+$/,'').replace(/[^\w-]+/g,'_').slice(0,40):'screenshot');
    const name=`${t.id}_${base}_${Date.now().toString(36)}.${ext||'png'}`;
    await writeFile(dir,name,f);r.attachments.push(name);
  }
  queueFeedbackSave(p);render();toast(`Attached ${files.length} file${files.length>1?'s':''} to ${t.id}`);
}

  const els=[...document.querySelectorAll('#app .test.st-untested,#app .test.st-retest,#app .test.st-stale,#app .test.issue.st-fail,#app .dec.st-Open,#app .idea.st-New,#app .idea.st-Ready')];
  if(!els.length){toast('Nothing left to deal with on this page');return}
  const off=stickyOffset();
  // the "current" item: the one you're working in, else the last one we jumped to
  const inside=document.activeElement?.closest?.('.test,.dec,.idea');
  let cur=els.indexOf(inside);if(cur<0&&S.curItem)cur=els.findIndex(x=>x.id===S.curItem);

/* where a dragged project would land: header = start of group, gap/empty = between or end, card = left quarter before, right quarter after, middle swap */
function dropTarget(e){

  const key=zone.dataset.drop??zone.dataset.dropHead;if(key==='*ideas')return null;

  const cards=grid?[...grid.querySelectorAll('[data-drag]')]:[];
  if(dragFav&&key!=='*fav')return null; // dragging a favourite out of the favourites row = unfavourite (handled separately)
  if(zone.dataset.dropHead!=null)return {key,mode:'end',zone,last:cards[cards.length-1]||null,head:true};
  const card=e.target.closest('[data-drag]');
  if(card){if(card.dataset.drag===dragPid)return {key,mode:'none'};const r=card.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;
    const other=key!=='*fav'&&(key==='_'?'':key)!==groupOf(getP(dragPid));

    return {key,zone,card,mode:f<.25?'before':f>.75?'after':((other||addingFav)&&!e.shiftKey?'before':'swap')}}

async function poll(){
  if(document.hidden||S.polling)return;S.polling=true;const msgs=[];let go=null;
  try{
    for(const p of S.projects){
      if(!p.loaded)continue;
      const sp=await p.pm.getFileHandle('AGENT_SETUP.md').then(()=>true,()=>false);
      if(sp!==!!p.setupPending){p.setupPending=sp;if(!sp)msgs.push(`${projName(p)}: agent finished setup`)}
      {let f;try{f=await (await p.pm.getFileHandle('AGENT_LOG.md')).getFile()}catch{}if(f&&f.lastModified!==p.mt.alog){p.mt.alog=f.lastModified;p.alog=parseAgentLog(await f.text());applyRetestResets(p);requestRender()}}
      {const cm=await pollChanges(p);if(cm){msgs.push(cm);p._agentTouched=true;p.lastUpd={who:'Agent',t:Date.now()};go=go||{pid:p.id,tab:'changes',gfilter:'all',label:'Show'}}}
      for(const [k,file] of [['tests','TESTS.md'],['features','FEATURES.md'],['decisions','DECISIONS.md'],['ideas','IDEAS.md']]){
        let f;try{f=await (await p.pm.getFileHandle(file)).getFile()}catch{continue}
        if(f.lastModified===p.mt[k])continue;
        const text=await f.text();p.mt[k]=f.lastModified;
        const lost=await guardLoss(p,k,file,text);if(lost)msgs.push(lost);
        p._agentTouched=true;p.lastUpd={who:'Agent',t:f.lastModified};
        if(k==='tests'){const beforeB=new Set(p.tests.batches.map(b=>b.version)),before=new Set(allTests(p).map(t=>t.id));p.tests=parseTests(text);const addedT=allTests(p).filter(t=>!before.has(t.id)),added=addedT.length;if(added)reactivate(p,'new tests were added');
          const nb=p.tests.batches.find(b=>!beforeB.has(b.version));
          if(nb){msgs.push(`${projName(p)}: new test batch ${nb.version} (${nb.tests.length} test${nb.tests.length===1?'':'s'})`);go=go||{pid:p.id,tab:'testing',tsub:'batches',batch:nb.version,filter:'todo',label:'Start testing'}}

          msgs.push(`${projName(p)}: ${n?n+' new idea'+(n>1?'s':''):'IDEAS.md updated'}`);if(n)go=go||{pid:p.id,tab:'ideas',ifilter:'pending',label:'Show ideas'}}
        else if(k==='decisions'){const before=new Set((p.dec?.items||[]).map(d=>d.id));p.dec=parseDecisions(text);const n=p.dec.items.filter(d=>!before.has(d.id)&&d.status==='Open').length;if(n){reactivate(p,'a new decision was added');go=go||{pid:p.id,tab:'decisions',dfilter:'open',label:'Decide'}}msgs.push(`${projName(p)}: ${n>0?n+' new decision'+(n>1?'s':'')+' to make':'DECISIONS.md updated'}`)}
        else{const before=new Set(allFeatures(p.features).map(f=>f.id));p.features=parseFeatures(text);if(allFeatures(p.features).some(f=>!before.has(f.id)))reactivate(p,'a new feature was added');msgs.push(`${projName(p)}: FEATURES.md updated`)}
      }
    }
  }catch(e){console.warn(e)}finally{S.polling=false}
  if(S.ws&&S.trips?.loaded){const sig=S.trips.list.map(t=>t.slug+t.mtime).join();await loadTrips().catch(()=>{});if(sig!==S.trips.list.map(t=>t.slug+t.mtime).join()&&S.view.page==='trips')requestRender()}
  if(S.ws&&S.nb.loaded){const sig=S.nb.topics.map(t=>t.file+t.mtime).join();await loadNotebook().catch(()=>{});if(sig!==S.nb.topics.map(t=>t.file+t.mtime).join()&&S.view.page==='notebook')requestRender()}

}

  else if(kind==='t'){const t=getTrip(id);if(!t)return;if(f==='title'){if(!v.trim())return;t.data.title=v.trim()}else t.data[f]=f==='summary'?v.trim():f==='color'?(validColor(v)||''):v;saveTrip(t)}
  else{const t=getTopic(id);if(!t)return;if(f==='title'){if(!v.trim())return;t.title=v.trim()}else t[f]=f==='summary'?v.trim():f==='color'?(validColor(v)||''):v;saveTopic(t)}
  render();
}
/* small HSV picker with rounded corners (the browser's own picker can't be styled) */
const hsv2hex=(hh,s,v)=>{const f=n=>{const k=(n+hh/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return '#'+[f(5),f(3),f(1)].map(x=>x.toString(16).padStart(2,'0')).join('')};
function hex2hsv(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let hh=0;if(d){hh=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60;if(hh<0)hh+=360}return [hh,mx?d/mx:0,mx]}
function openPicker(kind,id,start){
  const pop=$('#cpPop');if(!pop)return;if(!pop.hidden){pop.hidden=true;return}
  let [hh,sa,va]=hex2hsv(validColor(start)||'#5f95b8');
  pop.innerHTML=`<div class="cp-sv"><span class="cp-dot"></span></div><input type="range" class="cp-hue" min="0" max="359" value="${Math.round(hh)}" aria-label="Hue">
    <div class="cp-row"><span class="cp-prev"></span><input type="text" class="cp-hex" maxlength="7" aria-label="Hex color"><button class="ghost" data-x="cancel">Cancel</button><button class="primary" data-x="use">Use</button></div>`;
  pop.hidden=false;const sv=pop.querySelector('.cp-sv'),dot=pop.querySelector('.cp-dot'),hue=pop.querySelector('.cp-hue'),hex=pop.querySelector('.cp-hex'),prev=pop.querySelector('.cp-prev');
  const upd=(fromHex)=>{const c=hsv2hex(hh,sa,va);sv.style.backgroundColor=`hsl(${hh},100%,50%)`;dot.style.left=sa*100+'%';dot.style.top=(1-va)*100+'%';prev.style.background=c;if(!fromHex)hex.value=c;return c};
  upd();
  const drag=e=>{const r=sv.getBoundingClientRect();sa=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));va=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));upd()};
  sv.addEventListener('pointerdown',e=>{sv.setPointerCapture(e.pointerId);drag(e);sv.onpointermove=drag});sv.addEventListener('pointerup',()=>{sv.onpointermove=null});
  hue.addEventListener('input',()=>{hh=+hue.value;upd()});
  hex.addEventListener('input',()=>{const c=validColor(hex.value.startsWith('#')?hex.value:'#'+hex.value);if(c){[hh,sa,va]=hex2hsv(c);hue.value=Math.round(hh);upd(true)}});
  pop.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;e.stopPropagation();
    if(b.dataset.x==='cancel'){pop.hidden=true;return}

}

function startRun(p){

  const bsel=v.batch&&v.batch!=='*'?v.batch:null;
  const pool=(bsel?bs.filter(b=>b.version===bsel):bs).flatMap(b=>b.tests);
  let ids=sortTests([...pool],effPref(v.order,'test_ord'),p).filter(t=>['untested','retest','stale'].includes(effState(p,t))).map(t=>t.id);
  if(!ids.length){toast('Nothing left to test here. Pick another batch or "All batches".');return}

function runTest(p){return S.run?allTests(p).find(t=>t.id===S.run.ids[S.run.i]):null}
function runStats(p){const c={done:0,pass:0,partial:0,fail:0,blocked:0,skipped:0,retest:0,left:0};
  for(const id of S.run.ids){const t=allTests(p).find(x=>x.id===id);const s=t?effState(p,t):'untested';if(s==='untested'||s==='stale'||s==='retest')c.left++;else{c.done++;c[s]=(c[s]||0)+1}}return c}

    <button data-act="run-step" data-d="1">${R.i===n-1?'Finish':'Next'} <kbd>→</kbd>${ic('chevR')}</button></div>`;

function runStep(d){

function runMark(state){

  const r=touch(p,t);r.state=state;if(state==='fail'||state==='partial'){if(!r.severity)r.severity='Minor'}else r.severity='';
  queueFeedbackSave(p);render();
  runAfterMark(p,t,state)}

function runAfterMark(p,t,state){

/* ---------- SEARCH across projects (Ctrl+K) ---------- */
function searchIndex(scope){
  const out=[],L=layout();
  for(const p of S.projects){
    if(!p.loaded)continue;
    if(scope&&scope!=='*'){if(scope.startsWith('p:')){if(scope.slice(2)!==p.id)continue}else if(groupOf(p)!==scope)continue}
    const add=(type,id,title,text,go,hl)=>out.push({p,type,id,title,text:(title+'\n'+text).toLowerCase(),raw:text,go,hl});
    add('project','',projName(p),p.features.summary||'',{tab:'overview'},null);
    for(const t of allTests(p)){const r=p.fb.results[t.id];add('test',t.id,t.title,[t.setup,...t.steps,t.expected,...t.desc,r?.notes||''].join('\n'),{tab:'testing',tsub:'batches',batch:t.batch,filter:'all'},'t-'+t.id)}
    for(const i of p.fb.issues||[])add('change',i.id,i.title,[i.kind,i.notes||'',i.reply||''].join('\n'),{tab:'changes',gfilter:'all'},'t-'+i.id);
    for(const d of p.dec?.items||[])add('decision',d.id,d.title,[...d.details,...d.options.map(x=>x.text),d.decision,...d.notes].join('\n'),{tab:'decisions',dfilter:'all'},'d-'+d.id);
    for(const i of p.ideas?.items||[])add('idea',i.id,i.title,i.details.join('\n'),{tab:'ideas',ifilter:'all'},'i-'+i.id);
    for(const f of allFeatures(p.features))add('feature',f.id,f.title,[...f.desc,...f.parts.map(x=>x.text)].join('\n'),{tab:'features'},'f-'+f.id);
  }
  if(!scope||scope==='*')for(const tr of S.trips?.list||[]){const d=tr.data;out.push({trip:tr,type:'trip',id:'',title:d.title,text:(d.title+'\n'+(d.summary||'')).toLowerCase(),raw:d.summary||''});
    const walk=(list,opt)=>{for(const s of list){if(s.t==='split'){out.push({trip:tr,type:'split',id:'',title:s.title||'Alternative paths',text:[s.title,...s.options.map(o=>o.name)].join('\n').toLowerCase(),raw:s.options.map(o=>o.name).join(' / '),tsid:s.id});for(const o of s.options)walk(o.steps,o);continue}
      const ttl=s.t==='leg'?`${(TRIP_METHODS.find(z=>z[0]===s.method)||TRIP_METHODS[6])[1]}${s.label?' '+s.label:''}`:s.name||'';const tx=[s.notes,...(s.links||[]).map(l=>l.t+' '+l.u),...(s.transfers||[]).map(x=>x.name)].filter(Boolean).join('\n');
      if(ttl||tx)out.push({trip:tr,type:s.t==='leg'?'leg':s.t==='country'?'country':'stop',id:'',title:ttl||s.t,text:(ttl+'\n'+tx).toLowerCase(),raw:(opt?opt.name+' · ':'')+tx,tsid:s.id});
      for(const it of s.items||[])out.push({trip:tr,type:it.t==='custom'?'item':it.t,id:'',title:it.title||it.t,text:[it.title,it.address,it.conf,it.notes,...(it.links||[]).map(l=>l.t+' '+l.u)].filter(Boolean).join('\n').toLowerCase(),raw:(s.name||'')+(it.address?' · '+it.address:''),tsid:it.id})}};walk(d.steps,null);for(const x of d.docs||[])out.push({trip:tr,type:'document',id:'',title:x.title||(DOC_KINDS.find(k=>k[0]===x.kind)||DOC_KINDS[6])[1],text:[x.title,x.holder,x.number,x.notes,x.kind].filter(Boolean).join('\n').toLowerCase(),raw:(x.expiry?'expires '+x.expiry:'')+(x.holder?' · '+x.holder:''),tsid:x.id,doc:true})}
  if(!scope||scope==='*'||scope==='nb')for(const t of S.nb?.topics||[]){
    const add=(type,title,text)=>out.push({nb:t,type,id:'',title,text:(title+'\n'+text).toLowerCase(),raw:text});
    add('topic',t.title,[t.status,t.summary,t.tags.map(x=>'#'+x).join(' ')].join('\n'));
    for(const p of t.pages)for(const [list,sec] of [[p.loose,null],...p.sections.map(x=>[x.items,x])]){if(sec)out.push({nb:t,type:'section',id:'',title:sec.title||'Untitled section',text:(sec.title||'').toLowerCase(),raw:p.title||'',secId:sec.id});
      for(const e of list)for(const x of [e,...(e.children||[])]){const ttl=(x.title||x.text||x.file||x.date||'').split('\n')[0].slice(0,80)||x.kind,tx=[x.text,x.url,x.date].filter(Boolean).join(' ');

/* ---------- BATCH REPORT (idea 8) ---------- */
function batchReport(p,ver){
  const b=p.tests.batches.find(x=>x.version===ver);if(!b)return '';const c=batchStats(p,b),R=p.fb.results;
  const st=t=>effState(p,t),line=t=>{const r=R[t.id]||{},n=(r.notes||'').trim().split(/\r?\n/)[0];return `- ${t.id} · ${t.title}${n?` — ${n}`:''}`};
  let o=`# ${projName(p)} — batch ${ver} test report\n\nBatch date: ${b.date||'—'} · Report: ${nowStamp().slice(0,10)}\n\n**${c.total} tests:** ${c.pass} pass · ${c.partial} partial · ${c.fail} fail · ${c.blocked} blocked · ${c.skipped} skipped · ${c.retest} needs retest · ${c.untested} untested\n`;
  if(b.notes.length)o+=`\n${b.notes.join('\n')}\n`;
  const issues=b.tests.filter(t=>['fail','partial'].includes(st(t)));
  if(issues.length){o+=`\n## Issues found (${issues.length})\n\n`;for(const t of issues){const r=R[t.id];const res=resolution(p,t);o+=`- **${st(t).toUpperCase()}${r.severity?' · '+r.severity:''}** ${t.id} · ${t.title}${res?.status==='resolved'?` (fixed: ${res.by.id} passed)`:''}\n`;if(r.notes?.trim())o+=r.notes.trim().split(/\r?\n/).map(l=>`  > ${l}`).join('\n')+'\n'}}
  const pass=b.tests.filter(t=>st(t)==='pass');if(pass.length)o+=`\n## Passed (${pass.length})\n\n${pass.map(line).join('\n')}\n`;
  const other=b.tests.filter(t=>!['pass','fail','partial'].includes(st(t)));if(other.length)o+=`\n## Not tested / blocked / skipped (${other.length})\n\n${other.map(t=>line(t)+` _(${STATE_LABEL[st(t)]})_`).join('\n')}\n`;

  return o;
}

/* ---------- ACTIVITY HISTORY (idea 9) ---------- */
function actSnap(p){
  const s={batches:{},feats:{},decs:{},ideas:{},issues:{},res:{},titles:{}};
  const SL={pass:'Pass',partial:'Partial',fail:'Fail',blocked:'Blocked',skipped:'Skipped',retest:'Needs retest'};
  for(const t of allTests(p)){const r=p.fb.results[t.id];if(r&&r.state){s.res[t.id]=SL[r.state]+(r.severity&&(r.state==='fail'||r.state==='partial')?' ('+r.severity+')':'');s.titles[t.id]=t.title}}
  for(const b of p.tests.batches){const c=batchStats(p,b);s.batches[b.version]={total:c.total,done:c.done,pass:c.pass,partial:c.partial,fail:c.fail}}
  for(const f of allFeatures(p.features)){s.feats[f.id]=f.parts.length?Math.round(featPct(f))+'%':f.stage;s.titles[f.id]=f.title}
  for(const d of p.dec?.items||[]){s.decs[d.id]=d.status;s.titles[d.id]=d.title}
  for(const i of p.ideas?.items||[]){s.ideas[i.id]=i.status+(i.became?' → '+i.became:'');s.titles[i.id]=i.title}
  for(const i of p.fb.issues||[]){const r=issueRes(p,i);s.issues[i.id]=r?.status==='resolved'?'resolved':i.status;s.titles[i.id]=i.title}
  return s;
}
function actDiff(a,b){
  const ev=[],T=id=>b.titles[id]||a.titles?.[id]||'';
  for(const v in b.batches){const o=a.batches?.[v],n=b.batches[v];
    if(!o)ev.push({kind:'batch',ref:{type:'batch',id:v},text:`New test batch ${v} (${n.total} test${n.total===1?'':'s'})`});
    else{if(n.total>o.total)ev.push({kind:'batch',ref:{type:'batch',id:v},text:`${n.total-o.total} test${n.total-o.total>1?'s':''} added to batch ${v}`});
      if(n.done===n.total&&n.total&&o.done<o.total)ev.push({kind:'batch',ref:{type:'batch',id:v},text:`Finished testing batch ${v}: ${n.pass} pass, ${n.partial} partial, ${n.fail} fail`})}}
  const pairs=[['res','test','r'],['feats','feature','f'],['decs','decision','d'],['ideas','idea','i'],['issues','issue','t']];
  for(const [k,type] of pairs){
    for(const id in b[k]){const o=a[k]?.[id],n=b[k][id];
      if(o==null)ev.push({kind:type,ref:{type,id},text:type==='test'?`${id} · ${T(id)}: marked ${n}`:`New ${type} ${id} · ${T(id)}${type==='feature'?` [${n}]`:''}`});
      else if(o!==n)ev.push({kind:type,ref:{type,id},text:`${id} · ${T(id)}: ${o} → ${n}`})}
    for(const id in a[k]||{})if(!(id in b[k]))ev.push(type==='test'?{kind:type,ref:{type,id},text:`${id} · ${T(id)}: result cleared`}:{kind:type,ref:{type,id},text:`${type[0].toUpperCase()+type.slice(1)} ${id} · ${T(id)} was removed`,warn:true});
  }
  return ev;
}

function nbHost(url){if(/^#project\//.test(url)){const p=getP(decodeURIComponent(url.split('/')[1].split('?')[0]));return 'Workbench'+(p?' · '+projName(p):'')}if(/^#notebook\//.test(url))return 'Workbench · Notebooks';try{return new URL(nbHref(url)).host}catch{return url}}
function linkFromHit(x){
  if(x.trip)return {title:'Trips › '+x.trip.data.title+(x.tsid?' › '+x.title.slice(0,40):''),url:'#trips/'+encodeURIComponent(x.trip.slug)};
  if(x.nb){const base='#notebook/'+encodeURIComponent(x.nb.slug);return {title:'Notebooks › '+x.nb.title+(x.elId?' › '+x.title.slice(0,40):''),url:base+(x.elId?'?el='+x.elId:'')}}
  const go={...x.go};const {tab,tsub,...rest}=go;
  const parts=['project',x.p.id,tab||'overview',...(tab==='testing'?[tsub||'batches']:[])].map(encodeURIComponent).join('/');
  const qs=new URLSearchParams({...Object.fromEntries(Object.entries(rest).filter(([,v])=>v!=null).map(([k,v])=>[k,String(v)])),...(x.hl?{hl:x.hl}:{})}).toString();
  const what=x.type==='project'?projName(x.p):`${x.id?x.id+' · ':''}${x.title}`;
  return {title:x.type==='project'?what:`${projName(x.p)} › ${what}`,url:'#'+parts+(qs?'?'+qs:'')}}
function itemStatus(url){
  let m=String(url||'').match(/^#notebook\/([^?]+)/);if(m){const t=getTopic(decodeURIComponent(m[1]));return t?{label:t.status,cls:NB_ST_CLS[t.status],icon:'book'}:{label:'missing',cls:'',icon:'book'}}
  m=String(url||'').match(/^#project\/([^/?]+)[^?]*(?:\?(.*))?$/);if(!m)return null;const p=getP(decodeURIComponent(m[1]));if(!p||!p.loaded)return {label:'not loaded',cls:'',icon:'folder'};
  const hl=new URLSearchParams(m[2]||'').get('hl')||'',id=hl.replace(/^[tdif]-/,'');
  if(!hl)return {label:projStatus(p),cls:'st-'+projStatus(p),icon:'folder'};
  if(hl.startsWith('t-')&&/^GI-/.test(id)){const i=findGi(p,id);return i?{label:GI_STATUS[i.status]||i.status,cls:giOpen(p,i)?'c-open':'c-pass',icon:'edit'}:null}
  if(hl.startsWith('t-')){const t=allTests(p).find(x=>x.id===id);if(!t)return {label:'missing',cls:'',icon:'flask'};const s=effState(p,t);return {label:STATE_LABEL[s],cls:'c-'+(s==='stale'?'retest':s),icon:'flask'}}
  if(hl.startsWith('d-')){const d=(p.dec?.items||[]).find(x=>x.id===id);return d?{label:d.status,cls:'dec-'+d.status,icon:'scale'}:null}
  if(hl.startsWith('i-')){const i=(p.ideas?.items||[]).find(x=>x.id===id);return i?{label:i.status,cls:'idea-'+i.status,icon:'bulb'}:null}
  if(hl.startsWith('f-')){const f=allFeatures(p.features).find(x=>x.id===id);return f?{label:f.parts.length?fmtPct(featPct(f)):f.stage,cls:'',icon:'layers'}:null}
  return null}
/* ---- images ---- */
async function nbAttUrl(n){const k='nb|'+n;if(S.urls[k])return S.urls[k];const d=await (await nbDir()).getDirectoryHandle('attachments');return S.urls[k]=URL.createObjectURL(await (await d.getFileHandle(n)).getFile())}
const nbIconImg=(t,cls='')=>{if(!t?.icon)return '';const v=t.iconV||0,u=S.urls['nbi|'+t.icon+'|'+v];return `<img class="picon ${cls}" data-nbicon="${h(t.icon)}" data-v="${v}"${u?` src="${u}"`:''} alt="">`};
function loadNbIcons(){document.querySelectorAll('img[data-nbicon]').forEach(async img=>{const k='nbi|'+img.dataset.nbicon+'|'+img.dataset.v;if(img.getAttribute('src')&&S.urls[k])return;
  try{if(!S.urls[k])S.urls[k]=URL.createObjectURL(await fileAtPath(await nbDir(),img.dataset.nbicon));img.src=S.urls[k]}catch{img.replaceWith(Object.assign(document.createElement('span'),{className:'picon '+[...img.classList].filter(c=>c!=='picon').join(' ')+' empty',innerHTML:ic('image')}))}})}
function loadNbThumbs(){loadNbIcons();document.querySelectorAll('img[data-nbatt]').forEach(async img=>{const k='nb|'+img.dataset.nbatt;if(S.urls[k]&&img.getAttribute('src'))return;try{const u=await nbAttUrl(img.dataset.nbatt);img.src=u;const a=img.closest('a');if(a)a.href=u}catch{img.alt='missing: '+img.dataset.nbatt}})}
async function nbSaveFiles(t,files){const d=await (await nbDir()).getDirectoryHandle('attachments',{create:true}),names=[];
  for(const f of files){const ext=(f.name&&/\.[a-z0-9]+$/i.test(f.name)?f.name.match(/\.[a-z0-9]+$/i)[0]:'.'+((f.type||'').split('/')[1]||'png')).toLowerCase();const n=`${t.slug}-${Date.now().toString(36)}${names.length}${ext}`;await writeFile(d,n,f);names.push({name:n,orig:f.name||n,image:/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|svg)$/i.test(n)})}return names}
/* ---- edited label (WB-138) ---- */
function editedLabel(stamp){if(!stamp)return {text:'',title:''};const d=new Date(String(stamp).replace(' ','T'));if(isNaN(d))return {text:'Edited '+stamp,title:stamp};
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),today=day(new Date()),dd=day(d),tm=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).toLowerCase().replace(/\s/g,' ');
  const full=d.toLocaleString([],{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  if(dd===today)return {text:`Edited Today | ${tm}`,title:full};if(dd===today-864e5)return {text:`Edited Yesterday | ${tm}`,title:full};
  return {text:'Edited '+d.toLocaleDateString([],{month:'short',day:'numeric',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})}),title:full}}

function nbText(t,deep){return deep?[t.title,t.summary,t.tags.join(' '),...[...allEls(t)].map(e=>[e.text,e.title,e.url,e.date].filter(Boolean).join(' ')),...t.pages.flatMap(p=>[p.title,...p.sections.map(s=>s.title)])].join('\n'):[t.title,t.summary,t.tags.join(' ')].join('\n')}

  <span class="spacer" style="flex:1"></span>${sortBox('nbsort',[['recent','Recent','Last edited first'],['alpha','Alphabet','A to Z'],['newest','Newest','Created most recently'],['oldest','Oldest','Created first']],srt)}
  <span class="seg-btns">${[['active','Open + waiting'],['Open','Open'],['Waiting','Waiting'],['Done','Done'],['all','All']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="nb-filter" data-f="${k}">${l} (${cnt(k)})</button>`).join('')}</span>

const EL_TYPES=[['note','Note','edit'],['task','Task','check'],['link','Link','link'],['image','Image','image'],['file','File','clip'],['date','Date','dot'],['item','Workbench item','layers']];
function elVisible(e,q,hide){if(hide&&e.kind==='task'&&taskDone(e)&&!(e.children||[]).some(c=>elVisible(c,q,hide)))return false;if(!q)return true;
  return [e.text,e.title,e.url,e.date].filter(Boolean).join(' ').toLowerCase().includes(q)||(e.children||[]).some(c=>elVisible(c,q,false))}
function renderRows(t,list,ctx){
  const q=(S.nbtq||'').trim().toLowerCase(),hide=!!S.nbHideDone;let o='',i=0;
  while(i<list.length){const a=list[i],b=list[i+1]&&list[i+1].col===2?list[i+1]:null;
    const va=elVisible(a,q,hide),vb=b&&elVisible(b,q,hide);
    if(va||vb)o+=`<div class="nb-row${b?' two':''}">${va?renderEl(t,a,ctx):'<div></div>'}${b?(vb?renderEl(t,b,ctx):'<div></div>'):''}</div>`;
    i+=b?2:1}
  return o}
function renderEl(t,e,ctx){

    <div class="nb-page-add"><button class="ghost" data-act="nb-new-row" data-where="loose:${h(pg.id)}">${ic('plus')}New</button><button class="ghost" data-act="nb-sec-add">${ic('layers')}Section</button></div>`;

function tMerge(b,o,t){

function tripEndDate(d){const T=tripTotals(d),dd=[...new Set(T.flat.flatMap(x=>[tDate(x.s.arr),tDate(x.s.dep),tDate(x.s.start),tDate(x.s.end)]).filter(Boolean))].sort();return dd[dd.length-1]||''}
function docIssue(d,doc){if(!doc.expiry)return null;const today=nowStampS().slice(0,10),end=tripEndDate(d)||today;
  if(doc.expiry<today)return {lvl:'fail',msg:'Expired'};
  if(doc.expiry<end)return {lvl:'fail',msg:'Expires before the trip ends'};
  if(doc.kind==='passport'){const [y,m,dd]=end.split('-').map(Number);const six=new Date(Date.UTC(y,m-1+6,dd)).toISOString().slice(0,10);if(doc.expiry<six)return {lvl:'partial',msg:'Less than 6 months left after the trip (many countries require 6)'}}
  const soon=new Date(Date.now()+60*864e5).toISOString().slice(0,10);if(doc.expiry<soon)return {lvl:'partial',msg:'Expires within 60 days'};
  return null}
const docWarnings=d=>(d.docs||[]).map(x=>({x,i:docIssue(d,x)})).filter(z=>z.i);

function tLabel(x,d){const s=x.s;if(s.t==='leg'){const me=TRIP_METHODS.find(z=>z[0]===s.method)||TRIP_METHODS[6];return `${me[1]}${s.label?' '+s.label:''}: ${x.from?.s.name||'?'} → ${x.to?.s.name||'?'}${s.dep?' ('+String(s.dep).replace('T',' ')+')':''}`}

/* graph: every option of every split, side by side; the active path is solid */
function tripGraph(d){const nodes=[],edges=[];let lanes=0;
  const walk=(list,prevs,col,lane,dim)=>{let pend=[];const start=nodes.length;prevs=prevs.map(p=>({...p}));
    for(const s of list){
      if(s.t==='leg'){pend.push(s);continue}
      if(s.t==='city'||s.t==='place'){nodes.push({s,col,lane,dim});for(const p of prevs)edges.push({from:p.id,to:s.id,legs:[...(p.legs||[]),...pend],dim:dim||p.dim});prevs=[{id:s.id,legs:[],dim}];pend=[];col++;continue}
      if(s.t==='split'){const ends=[];let maxc=col,cur=lane;const carry=prevs.map(p=>({...p,legs:[...(p.legs||[]),...pend]}));pend=[];
        s.options.forEach((o,i)=>{const r=walk(o.steps,carry,col,cur,dim||o.id!==s.active);ends.push(...r.ends);maxc=Math.max(maxc,r.col);cur=Math.max(cur,r.maxLane)+1});
        lanes=Math.max(lanes,cur-1);prevs=ends;col=maxc;continue}}
    return {ends:prevs.map(p=>({...p,legs:[...(p.legs||[]),...pend]})),col,maxLane:Math.max(lane,...nodes.slice(start).map(n=>n.lane))}};
  walk(d.steps,[],0,0,false);return {nodes,edges,lanes:Math.max(lanes,...nodes.map(n=>n.lane),0)}}
function renderGraph(t){const d=t.data,G=tripGraph(d);if(!G.nodes.length)return `<div class="empty">Add cities or places to see the graph.</div>`;
  const W=150,Hh=46,CX=200,CY=86,P=16,pos=new Map(G.nodes.map(n=>[n.s.id,{x:P+n.col*CX,y:P+n.lane*CY}]));
  const w=P*2+Math.max(...G.nodes.map(n=>n.col))*CX+W,hh=P*2+G.lanes*CY+Hh;
  const ed=G.edges.map(e=>{const a=pos.get(e.from),b=pos.get(e.to);if(!a||!b)return '';const x1=a.x+W,y1=a.y+Hh/2,x2=b.x,y2=b.y+Hh/2,mx=(x1+x2)/2;
    const lbl=e.legs.map(l=>{const me=TRIP_METHODS.find(z=>z[0]===l.method)||TRIP_METHODS[6];return me[1]}).join(' + ');
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" class="tg-e${e.dim?' dim':''}"/>${lbl?`<text x="${mx}" y="${(y1+y2)/2-6}" class="tg-l${e.dim?' dim':''}" text-anchor="middle">${h(lbl)}</text>`:''}`}).join('');
  const nd=G.nodes.map(n=>{const p=pos.get(n.s.id);return `<g class="tg-n${n.dim?' dim':''}" data-act="t-graph-go" data-id="${n.s.id}" data-dim="${n.dim?1:''}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${Hh}" rx="10"/><text x="${p.x+12}" y="${p.y+19}" class="tg-t">${h((n.s.name||'?').slice(0,18))}</text><text x="${p.x+12}" y="${p.y+35}" class="tg-s">${h(n.s.arr?String(n.s.arr).replace('T',' ').slice(5,16):n.s.t)}</text></g>`}).join('');
  return `<div class="toolbar"><span class="muted small">Every option of every split. The active path is solid; other options are faded. Click a stop to find it on the Timeline.</span></div><div class="panel t-graph" style="${d.color?'--pc:'+d.color:''}"><svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}">${ed}${nd}</svg></div>`}

class MemFile{constructor(n,d=''){this.kind='file';this.name=n;this.data=new Blob([d]);this.mtime=Date.now()}
  async getFile(){return new File([this.data],this.name,{lastModified:this.mtime})}
  async createWritable(){const s=this,parts=[];return {async write(d){parts.push(d)},async close(){s.data=new Blob(parts);s.mtime=Date.now()+Math.random()}}}
  async isSameEntry(o){return o===this}}
class MemDir{constructor(n){this.kind='directory';this.name=n;this.c=new Map()}
  async getDirectoryHandle(n,o={}){let e=this.c.get(n);if(!e){if(!o.create)throw nf();e=new MemDir(n);this.c.set(n,e)}if(e.kind!=='directory')throw new DOMException('x','TypeMismatchError');return e}
  async getFileHandle(n,o={}){let e=this.c.get(n);if(!e){if(!o.create)throw nf();e=new MemFile(n);this.c.set(n,e)}if(e.kind!=='file')throw new DOMException('x','TypeMismatchError');return e}
  async removeEntry(n){this.c.delete(n)}
  async *entries(){for(const kv of this.c)yield kv}
  async *values(){for(const v of this.c.values())yield v}
  async queryPermission(){return 'granted'}async requestPermission(){return 'granted'}
  async isSameEntry(o){return o===this}
  async resolve(t){if(t===this)return [];for(const [n,e] of this.c){if(e===t)return [n];if(e.kind==='directory'){const r=await e.resolve(t);if(r)return [n,...r]}}return null}}

/* ---------------- boot ---------------- */
async function boot(){
  S.demo=new URLSearchParams(location.search).has('demo');
  S.set=loadSettings();applySettings();loadShoelace();
  S.mem=lsGet('wb-viewmem',{})||{};if(!lsGet('wb-pdef-v1',false)){for(const k in S.mem)for(const x of PREF_KEYS)delete S.mem[k][x];lsSet('wb-viewmem',S.mem);lsSet('wb-pdef-v1',true);S._pdefReset=true}S.layout=lsGet('wb-layout',null);
  S.favs=lsGet('wb-favs',{})||{};S.paths=lsGet('wb-paths',{})||{};
  if(RUN_MODE!=='file'&&!S.demo){
    const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.append(l);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.info('No offline cache:',e.message));
  }
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;renderSettings()});
  if(S.demo)setupDemo();
  else{
    if(!window.showDirectoryPicker){render();return}
    await idb.open();S.ws=await idb.get('workspace')||null;S.records=(await idb.get('projects'))||[];
  }
  await loadAll();if(S._pdefReset)for(const p of S.projects)if(p.loaded&&p.prefs&&Object.keys(p.prefs).length){p.prefs={};writeFile(p.pm,'workbench-view.json','{}').catch(()=>{})}
  await loadNotebook().catch(e=>console.warn('notebook',e));await loadTrips().catch(e=>console.warn('trips',e));S.since=S.demo?demoSince():sinceLast();S.view=routeFromHash()||S.view;S.booted=true;render();setInterval(poll,4000);autoRestoreProjects();
  if(S.since.length){const n=S.since.reduce((a,x)=>a+x.parts.reduce((b,y)=>b+y.n,0),0);toast(`${n} change${n>1?'s':''} across ${S.since.length} project${S.since.length>1?'s':''} since you were last here`)}
}
boot().catch(e=>{console.error(e);$('#app').innerHTML=`<div class="empty">Startup failed: ${h(e.message)}</div>`});
